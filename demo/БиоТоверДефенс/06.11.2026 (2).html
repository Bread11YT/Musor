<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Генобашни</title>
<style>
:root{--bg:#f4f2f8;--card:#fff;--tx:#241f36;--mut:#6b6580;--ac:#d6458f;--bd:#d9d4e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1f1b33;--tx:#ece8f7;--mut:#a39cbc;--ac:#e0559c;--bd:#342e4f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121f;--card:#1f1b33;--tx:#ece8f7;--mut:#a39cbc;--ac:#e0559c;--bd:#342e4f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,sans-serif;display:flex;justify-content:center}
#w{width:100%;max-width:480px;padding:8px}
.hud{display:flex;justify-content:space-between;font-weight:600;padding:4px 2px 8px}
canvas{width:100%;aspect-ratio:8/9;display:block;border-radius:12px;touch-action:manipulation}
.lab{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-top:8px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row b{width:96px;font-size:13px;color:var(--mut);font-weight:600}
.row span{flex:1;text-align:center}
button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit}
.row button{width:44px;height:38px;font-size:18px}
#go{width:100%;height:46px;background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700;margin-top:6px}
#go:disabled{opacity:.55}
#info{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.sh{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.sh button{padding:6px;font-size:13px;text-align:left;display:flex;gap:8px;align-items:center}.sh span{display:flex;align-items:center;gap:6px;font-size:13px}.sh span[data-k]{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}summary{cursor:pointer;color:var(--mut)}
#fd{min-height:34px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px;padding:4px 2px}#fd span{display:flex;align-items:center;gap:4px}
#rn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}#rn button{padding:8px 4px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}#rb{width:100%;height:42px;margin-top:6px;font-weight:600}
</style></head><body>
<div id="w">
<div class="hud"><span id="l"></span><span id="e"></span><span id="wv"></span></div>
<canvas id="c"></canvas><div id="fd"></div>
<div class="lab"><div id="dna"></div><details open><summary>Инвентарь</summary><div class="sh" id="sh"></div></details><div id="rows" style="display:none"></div><div id="info"></div><div id="tb" style="display:none;gap:6px;margin-top:6px"><button id="sell" style="flex:1;height:38px">Продать башню</button><button id="desel" style="flex:1;height:38px">Готово</button></div><div id="rn"></div><div id="rd" style="display:none;margin-top:6px"></div><button id="rb"></button><button id="go"></button></div>
</div>

const IM={};L.forEach(k=>IM[k]=ICON[k].map(s=>{const m=new Image();m.src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>${s}</svg>`);return m}));
const W={brain:[0,10,5,5,4,3],spine:[0,10,3,6,6,5,2],strike:[0,10,6,5,3,5,6,4],nerve:[0,6,5,5,5,3,4]};
const DESC={
brain:['Пусто: бьёт ближайшего, базовая дальность','Зоркий: дальность +40%, бьёт ближайшего','Тактик: дальность +25%, бьёт самого живучего','Охотник: дальность +25%, бьёт первого на пути','Падальщик: дальность +25%, добивает самого слабого','Орёл: дальность +80%, бьёт ближайшего'],

strike:['Пусто: обычный удар, урон 6','Укус: чистый урон 14','Яд: слабый удар и яд на 3 секунды','Шип: урон по площади вокруг цели','Шок: молния перескакивает ещё на 2 врагов','Кислота: цель получает на 25% больше урона 3 секунды','Плевок: урон 11 и дальность +30%','Огонь: поджигает цель, сильный урон со временем'],
nerve:['Пусто: без эффекта','Крит: 25% шанс ударить ×2.5','Ярость: урон +35%','Холод: замедляет врага на 1.5 секунды','Удача: враг, добитый этой башней, даёт +2 🧬','Эхо: 20% шанс ударить второй раз','Казнь: +60% урона по врагам с HP ниже 30%']};
let rsel=null,os=null,dg=null,lastDrag=0;let FL=[],ft;
function drop(){const a=[];L.forEach(k=>W[k].forEach((w,i)=>{for(let j=0;j<w;j++)a.push([k,i])}));const[k,i]=a[Math.random()*a.length|0];inv[k][i]++;FL.push(ic(k,i,26)+' '+P[k][i].n);FL=FL.slice(-4);$('fd').innerHTML='Выпало: '+FL.map(s=>'<span>'+s+'</span>').join('');clearTimeout(ft);ft=setTimeout(()=>{FL=[];$('fd').innerHTML=''},4000);shop();names()}
const RC=30;
function pick(){const a=[];L.forEach(k=>W[k].forEach((w,i)=>{for(let j=0;j<w;j++)a.push([k,i])}));return a[Math.random()*a.length|0]}
function showRn(){$('rn').innerHTML=rn?rn.map((p,j)=>`<button data-j='${j}' style='${j===rsel?'border:2px solid var(--ac)':''}'>${ic(p[0],p[1],34)}<span>${P[p[0]][p[1]].n}<br>${LN[p[0]]}</span></button>`).join(''):'';const r=$('rd');if(rn&&rsel!=null){const p=rn[rsel];r.style.display='block';r.innerHTML=`<div style='font-size:13px;line-height:1.4;margin-bottom:6px'>${DESC[p[0]][p[1]]}</div><button id='take' style='width:100%;height:40px;background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700'>Взять: ${P[p[0]][p[1]].n}</button>`}else{r.style.display='none';r.innerHTML=''}}
$('rb').onclick=()=>{if(rn||over)return;if(rolls>0)rolls--;else if(en>=RC)en-=RC;else return;rn=[pick(),pick(),pick()];rsel=null;showRn();hud()};
$('rn').onclick=e=>{const b=e.target.closest('button');if(!b||!rn)return;rsel=+b.dataset.j;showRn()};
$('rd').onclick=e=>{if(!e.target.closest('#take')||!rn||rsel==null)return;const p=rn[rsel];inv[p[0]][p[1]]++;rn=null;rsel=null;showRn();shop();names();hud()};
$('sh').onpointerdown=e=>{const s=e.target.closest('span[data-k]');if(!s)return;dg={k:s.dataset.k,i:+s.dataset.i,x:e.clientX,y:e.clientY,on:false,id:e.pointerId}};
addEventListener('pointermove',e=>{if(!dg||e.pointerId!=dg.id)return;if(!dg.on){if(Math.hypot(e.clientX-dg.x,e.clientY-dg.y)<10)return;dg.on=true;const gh=document.createElement('div');gh.style.cssText='position:fixed;left:0;top:0;width:46px;height:46px;border-radius:50%;background:var(--card);border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:99';gh.innerHTML=ic(dg.k,dg.i,32);document.body.appendChild(gh);dg.gh=gh;$('dna').querySelectorAll('g[data-s]').forEach(g=>{g.style.opacity=g.dataset.s==dg.k?1:.3;if(g.dataset.s==dg.k)g.firstChild.style.stroke='var(--ac)'})}dg.gh.style.transform=`translate(${e.clientX-23}px,${e.clientY-70}px)`});

for(let i=0;i<=40;i++){const x=8+i*8.2,y=Math.sin(i/40*Math.PI*8)*26;g+=`<line x1='${x}' y1='${52+y}' x2='${x}' y2='${52-y}' stroke='${cs[i%4]}' stroke-width='3' opacity='.45'/>`}
g+=`<path d='${a}' fill='none' stroke='#b66be8' stroke-width='3.5'/><path d='${b}' fill='none' stroke='#6bb8e8' stroke-width='3.5'/>`;
L.forEach((k,j)=>{const x=XS[j],on=os==k;g+=`<g data-s='${k}' style='cursor:pointer'><circle cx='${x}' cy='52' r='27' style='fill:var(--card);stroke:${on?'var(--ac)':'var(--bd)'}' stroke-width='${on?4:2.5}'/><svg x='${x-17}' y='35' width='34' height='34' viewBox='0 0 32 32'>${ICON[k][s[k]]}</svg><text x='${x}' y='103' text-anchor='middle' font-size='12' style='fill:var(--mut)'>${LN[k]}</text></g>`});
g+='</svg>';let t;
if(os){const k=os;t=`<div class='sh' style='margin-top:4px'>${P[k].map((p,i)=>(i==0||inv[k][i]>0||i==s[k])?`<button data-p='${i}' style='${i==s[k]?'border:2px solid var(--ac)':''}'>${ic(k,i,28)}<span>${p.n}${i&&!selT?' ×'+inv[k][i]:''}</span></button>`:'').join('')}</div><div style='font-size:13px;color:var(--mut);margin-top:6px'>${DESC[k][s[k]]}</div>`}
else t=`<div style='font-size:12.5px;color:var(--mut);text-align:center'>Тапни орган на цепочке ДНК, чтобы выбрать часть</div>`;
$('dna').innerHTML=g+t}
$('rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,n=P[k].length,d=+b.dataset.d,s=selT?selT.sel:sel,cur=s[k];let i=cur;do i=(i+d+n)%n;while(i!=cur&&!inv[k][i]);
if(selT){if(i!=cur){if(cur)inv[k][cur]++;if(i)inv[k][i]--;s[k]=i;const z=st(s);if(selT.m){z.r*=selT.m.r;z.cd*=selT.m.cd;z.d*=selT.m.d}selT.st=z;shop()}}else s[k]=i;
names();hud()};
c.onclick=e=>{if(over)return;const r=c.getBoundingClientRect(),gx=Math.floor((e.clientX-r.left)/r.width*8),gy=Math.floor((e.clientY-r.top)/r.height*9);
const i=T.findIndex(t=>t.x==gx&&t.y==gy);
if(i>=0){selT=selT==T[i]?null:T[i];names();hud();return}
if(selT){selT=null;names();hud();return}
if(pc.has(gx+','+gy)||BASE>en)return;
const m=Math.random()<.25?MUT[Math.random()*3|0]:null,z=st(sel);if(m){z.r*=m.r;z.cd*=m.cd;z.d*=m.d}
T.push({x:gx,y:gy,m,sel:{...sel},cd:0,st:z});en-=BASE;L.forEach(k=>{if(sel[k]&&--inv[k][sel[k]]<1)sel[k]=0});shop();names();hud()};
$('go').onclick=()=>{if(over){reset();return}if(run)return;wave++;q=5+wave*2;sp=0;run=true;hud()};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hit(e,d,t,f=1){let v=d*f;if(t.st.nk=='crit'&&Math.random()<.25)v*=2.5;if(t.st.nk=='exec'&&e.hp<e.m*.3)v*=1.6;if(e.vu>0)v*=1.25;e.hp-=v;e.last=t;if(t.st.nk=='slow')e.sl=1.5;if(t.st.k=='poison'){e.po=3;e.pd=Math.max(e.pd,d*1.4)}if(t.st.k=='acid')e.vu=3;if(t.st.k=='burn'){e.bu=2.5;e.bd=Math.max(e.bd,d*2.2)}}
function beam(a,b,col){S.push({a:[a.x,a.y],b:[b.x,b.y],t:.12,c:col})}
function fire(t,tg){const k=t.st.k,col=SC[t.sel.strike];beam({x:t.x+.5,y:t.y+.5},tg,col);hit(tg,t.st.d,t);if(t.st.nk=='echo'&&Math.random()<.2)hit(tg,t.st.d,t);
if(k=='splash')E.forEach(o=>{if(o!=tg&&dist(o,tg)<1)hit(o,t.st.d,t,.7)});
if(k=='chain'){let p=tg;const u=[tg];for(let i=0;i<2;i++){const n=E.filter(o=>!u.includes(o)&&dist(o,p)<1.8).sort((a,b)=>dist(a,p)-dist(b,p))[0];if(!n)break;beam(p,n,col);hit(n,t.st.d,t,.7);u.push(n);p=n}}}
function upd(dt){if(over)return;
if(run&&q>0&&(sp-=dt)<=0){sp=.7;q--;const big=wave%4==0,h=18*1.17**wave*(big?2.8:1);E.push({d:0,hp:h,m:h,v:(big?.6:1)*(.9+Math.min(wave*.03,.9)),big,sl:0,po:0,pd:0,vu:0,bu:0,bd:0,x:-.5,y:1.5})}
for(const e of E){if(e.po>0){e.po-=dt;e.hp-=e.pd*dt}if(e.bu>0){e.bu-=dt;e.hp-=e.bd*dt}e.vu=Math.max(0,e.vu-dt);e.sl=Math.max(0,e.sl-dt);e.d+=e.v*(e.sl>0?.55:1)*dt;[e.x,e.y]=pos(e.d)}
for(const t of T){t.cd-=dt;if(t.cd>0)continue;const o={x:t.x+.5,y:t.y+.5},r=t.st.r,ts=E.filter(e=>dist(e,o)<=r);if(!ts.length)continue;
const m=t.st.t;ts.sort((a,b)=>m=='strong'?b.hp-a.hp:m=='first'?b.d-a.d:m=='weak'?a.hp-b.hp:dist(a,o)-dist(b,o));
t.cd=t.st.cd;fire(t,ts[0])}
for(let i=E.length-1;i>=0;i--){const e=E[i];if(e.hp<=0){en+=3+wave/3+(e.last&&e.last.st.nk=='gold'?2:0);if(e.big||Math.random()<.08)drop();E.splice(i,1)}else if(e.d>=tot){lives--;E.splice(i,1)}}
S.forEach(s=>s.t-=dt);S=S.filter(s=>s.t>0);
if(lives<=0){lives=0;over=true;run=false}
if(run&&q==0&&!E.length){run=false;en+=10+wave*2;rolls++}
hud()}
function circ(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,7);x.fill()}
function draw(){const k=c.width/8;x.setTransform(k,0,0,k,0,0);x.fillStyle='#1c1a33';x.fillRect(0,0,8,9);
for(let i=0;i<8;i++)for(let j=0;j<9;j++){x.fillStyle=pc.has(i+','+j)?'#4a2f48':'#262244';x.fillRect(i+.03,j+.03,.94,.94)}
for(const t of T){const cx=t.x+.5,cy=t.y+.5;circ(cx,cy,.4,'#2d2750');x.drawImage(IM.strike[t.sel.strike],cx-.3,cy-.3,.6,.6);x.drawImage(IM.brain[t.sel.brain],cx-.4,cy+.05,.3,.3);
if(t.sel.nerve){x.strokeStyle=NC[t.sel.nerve];x.lineWidth=.07;x.beginPath();x.arc(cx,cy,.4,0,7);x.stroke()}
if(t.m){x.font='.3px sans-serif';x.fillText(t.m.e,t.x+.04,t.y+.3)}}
if(selT){x.strokeStyle='#fff';x.lineWidth=.04;x.beginPath();x.arc(selT.x+.5,selT.y+.5,selT.st.r,0,7);x.stroke();x.lineWidth=.07;x.beginPath();x.arc(selT.x+.5,selT.y+.5,.46,0,7);x.stroke()}
for(const e of E){circ(e.x,e.y,e.big?.38:.26,e.po>0?'#7bd957':e.bu>0?'#ff8a2a':e.vu>0?'#b8e04a':e.sl>0?'#6bb8e8':'#e8655f');x.fillStyle='#000';x.fillRect(e.x-.25,e.y-.42,.5,.07);x.fillStyle='#5de0b0';x.fillRect(e.x-.25,e.y-.42,.5*Math.max(0,e.hp/e.m),.07)}
for(const s of S){x.strokeStyle=s.c;x.lineWidth=.06;x.beginPath();x.moveTo(s.a[0],s.a[1]);x.lineTo(s.b[0],s.b[1]);x.stroke()}
if(over){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,8,9);x.fillStyle='#fff';x.font='bold .6px sans-serif';x.textAlign='center';x.fillText('Конец · волна '+wave,4,4.6);x.textAlign='left'}}
function rs(){const d=devicePixelRatio||1;c.width=Math.round(c.clientWidth*d);c.height=Math.round(c.width*9/8)}
addEventListener('resize',rs);
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;upd(dt);draw();requestAnimationFrame(loop)}
reset();rs();requestAnimationFrame(loop);
</script></body></html>
