<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Генобашни</title>
<style>
:root{--bg:#f4f2f8;--card:#fff;--tx:#241f36;--mut:#6b6580;--ac:#d6458f;--bd:#d9d4e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1f1b33;--tx:#ece8f7;--mut:#a39cbc;--ac:#e0559c;--bd:#342e4f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121f;--card:#1f1b33;--tx:#ece8f7;--mut:#a39cbc;--ac:#e0559c;--bd:#342e4f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,sans-serif;display:flex;justify-content:center}
#w{width:100%;max-width:480px;padding:8px}
.hud{display:flex;justify-content:space-between;font-weight:600;padding:4px 2px 8px}
canvas{width:100%;aspect-ratio:8/9;display:block;border-radius:12px;touch-action:manipulation}
.lab{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-top:8px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row b{width:96px;font-size:13px;color:var(--mut);font-weight:600}
.row span{flex:1;text-align:center}
button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit}
.row button{width:44px;height:38px;font-size:18px}
#go{width:100%;height:46px;background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700;margin-top:6px}
#go:disabled{opacity:.55}
#info{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.sh{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.sh button{padding:6px;font-size:13px;text-align:left;display:flex;gap:8px;align-items:center}.sh span{display:flex;align-items:center;gap:6px;font-size:13px}summary{cursor:pointer;color:var(--mut)}
#fd{min-height:34px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px;padding:4px 2px}#fd span{display:flex;align-items:center;gap:4px}
#rn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}#rn button{padding:8px 4px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px}#rb{width:100%;height:42px;margin-top:6px;font-weight:600}
</style></head><body>
<div id="w">
<div class="hud"><span id="l"></span><span id="e"></span><span id="wv"></span></div>
<canvas id="c"></canvas><div id="fd"></div>
<div class="lab"><details open><summary>Инвентарь</summary><div class="sh" id="sh"></div></details><div id="rows"></div><div id="info"></div><div id="tb" style="display:none;gap:6px;margin-top:6px"><button id="sell" style="flex:1;height:38px">Продать башню</button><button id="desel" style="flex:1;height:38px">Готово</button></div><div id="rn"></div><button id="rb"></button><button id="go"></button></div>
</div>
<script>
const P={
brain:[{n:'Пусто',c:0,r:1,t:'near'},{n:'Зоркий',c:10,r:1.4,t:'near'},{n:'Тактик',c:14,r:1.25,t:'strong'},{n:'Охотник',c:12,r:1.25,t:'first'}],
spine:[{n:'Пусто',c:0,cd:1,dm:1},{n:'Гибкий',c:10,cd:.75,dm:1},{n:'Быстрый',c:22,cd:.5,dm:1},{n:'Толстый',c:14,cd:1.3,dm:1.6}],
strike:[{n:'Пусто',c:0,d:6},{n:'Укус',c:10,d:14},{n:'Яд',c:16,d:4,k:'poison'},{n:'Шип',c:18,d:9,k:'splash'},{n:'Шок',c:22,d:7,k:'chain'}],
nerve:[{n:'Пусто',c:0},{n:'Крит',c:12,k:'crit'},{n:'Ярость',c:14,k:'rage'},{n:'Холод',c:16,k:'slow'}]};
const L=['brain','spine','strike','nerve'],LN={brain:'Мозг',spine:'Спинной мозг',strike:'Удар',nerve:'Нервы'};
const SC=['#9a94b3','#f2c14e','#7bd957','#ef8354','#6bb8e8'],BC=['#9a94b3','#e58bd0','#b66be8','#8b9be5'],NC=[0,'#ffd23f','#ff5d73','#7fd1ff'];
const MUT=[{e:'⚡',cd:.7,r:.85,d:1},{e:'💪',cd:1,r:1,d:1.35},{e:'👁',cd:1,r:1.3,d:.85}];
const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');
let sel,inv,selT=null,rolls=0,rn=null,lives,en,wave,run,over,E,T,S,q,sp;
const wps=[[-1,1],[7,1],[7,3],[0,3],[0,5],[7,5],[7,7],[-1,7]],pc=new Set(),seg=[];let tot=0;
for(let i=0;i<wps.length-1;i++){const a=wps[i],b=wps[i+1],l=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]),dx=Math.sign(b[0]-a[0]),dy=Math.sign(b[1]-a[1]);seg.push([a,b,l,tot]);tot+=l;for(let k=0;k<=l;k++)pc.add((a[0]+dx*k)+','+(a[1]+dy*k))}
function pos(d){for(const[a,b,l,s]of seg)if(d<=s+l){const t=(d-s)/l;return[a[0]+(b[0]-a[0])*t+.5,a[1]+(b[1]-a[1])*t+.5]}return[-.5,7.5]}
const BASE=15;
const Z0=`<circle cx='16' cy='16' r='10' fill='none' stroke='#9a94b3' stroke-width='2' stroke-dasharray='4 3'/>`;
const ICON={
brain:[Z0,`<ellipse cx='16' cy='16' rx='13' ry='8' fill='#fff' stroke='#b64a9a' stroke-width='2.5'/><circle cx='16' cy='16' r='5' fill='#b64a9a'/>`,`<circle cx='12' cy='14' r='8' fill='#e58bd0'/><circle cx='21' cy='14' r='8' fill='#d36bbd'/><path d='M16 8v18' stroke='#7a2d68' stroke-width='2.5'/>`,`<circle cx='16' cy='16' r='12' fill='none' stroke='#b64a9a' stroke-width='3'/><circle cx='16' cy='16' r='6' fill='none' stroke='#b64a9a' stroke-width='3'/><circle cx='16' cy='16' r='2' fill='#b64a9a'/>`],
spine:[Z0,`<path d='M16 3c-9 6 9 8 0 13s9 8 0 13' fill='none' stroke='#6b8be8' stroke-width='4.5' stroke-linecap='round'/>`,`<path d='M19 2L7 18h8l-2 12 12-17h-8z' fill='#6b8be8'/>`,`<rect x='7' y='3' width='18' height='7' rx='3.5' fill='#5775d8'/><rect x='7' y='12.5' width='18' height='7' rx='3.5' fill='#6b8be8'/><rect x='7' y='22' width='18' height='7' rx='3.5' fill='#5775d8'/>`],
strike:[Z0,`<path d='M3 7h26l-4 13-5-7-4 13-4-13-5 7z' fill='#f2c14e' stroke='#b8861b' stroke-width='1.5' stroke-linejoin='round'/>`,`<path d='M16 2C10 12 6 16 6 21a10 10 0 0020 0c0-5-4-9-10-19z' fill='#7bd957' stroke='#3f9a28' stroke-width='2'/>`,`<path d='M16 2l7 17-7 11-7-11z' fill='#ef8354' stroke='#b8522a' stroke-width='2' stroke-linejoin='round'/>`,`<path d='M7 7l9 8-5 2 14 9' fill='none' stroke='#6bb8e8' stroke-width='3' stroke-linecap='round'/><circle cx='7' cy='7' r='4' fill='#6bb8e8'/><circle cx='25' cy='26' r='4' fill='#6bb8e8'/>`],
nerve:[Z0,`<path d='M16 2l4 9.5 10 .8-7.7 6.5 2.4 10L16 23l-8.7 5.8 2.4-10L2 12.3l10-.8z' fill='#ffd23f' stroke='#c99a00' stroke-width='1.5' stroke-linejoin='round'/>`,`<path d='M16 2c1 7 9 10 9 18a9 9 0 01-18 0c0-5 3-7 5-10 0 3 1 5 3 5-1-5-1-9 1-13z' fill='#ff5d73'/>`,`<path d='M16 3v26M5 9.5l22 13M5 22.5l22-13' stroke='#7fd1ff' stroke-width='3' stroke-linecap='round'/>`]};
const ic=(k,i,s=28)=>`<svg viewBox='0 0 32 32' width='${s}' height='${s}' style='flex:none'>${ICON[k][i]}</svg>`;
const IM={};L.forEach(k=>IM[k]=ICON[k].map(s=>{const m=new Image();m.src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>${s}</svg>`);return m}));
const W={brain:[0,10,5,5],spine:[0,10,3,6],strike:[0,10,6,5,3],nerve:[0,6,5,5]};let FL=[],ft;
function drop(){const a=[];L.forEach(k=>W[k].forEach((w,i)=>{for(let j=0;j<w;j++)a.push([k,i])}));const[k,i]=a[Math.random()*a.length|0];inv[k][i]++;FL.push(ic(k,i,26)+' '+P[k][i].n);FL=FL.slice(-4);$('fd').innerHTML='Выпало: '+FL.map(s=>'<span>'+s+'</span>').join('');clearTimeout(ft);ft=setTimeout(()=>{FL=[];$('fd').innerHTML=''},4000);shop();names()}
const RC=30;
function pick(){const a=[];L.forEach(k=>W[k].forEach((w,i)=>{for(let j=0;j<w;j++)a.push([k,i])}));return a[Math.random()*a.length|0]}
function showRn(){$('rn').innerHTML=rn?rn.map((p,j)=>`<button data-j="${j}">${ic(p[0],p[1],34)}<span>${P[p[0]][p[1]].n}<br>${LN[p[0]]}</span></button>`).join(''):''}
$('rb').onclick=()=>{if(rn||over)return;if(rolls>0)rolls--;else if(en>=RC)en-=RC;else return;rn=[pick(),pick(),pick()];showRn();hud()};
$('rn').onclick=e=>{const b=e.target.closest('button');if(!b||!rn)return;const p=rn[+b.dataset.j];inv[p[0]][p[1]]++;rn=null;showRn();shop();names();hud()};
$('sell').onclick=()=>{if(!selT)return;en+=BASE*.5;L.forEach(k=>{if(selT.sel[k])inv[k][selT.sel[k]]++});T.splice(T.indexOf(selT),1);selT=null;shop();names();hud()};
$('desel').onclick=()=>{selT=null;names();hud()};
function st(s){const b=P.brain[s.brain],p=P.spine[s.spine],k=P.strike[s.strike],n=P.nerve[s.nerve];return{r:1.8*b.r,t:b.t,cd:1.2*p.cd,d:k.d*p.dm*(n.k=='rage'?1.35:1),k:k.k,nk:n.k}}
function shop(){const h=L.flatMap(k=>P[k].map((p,i)=>i&&inv[k][i]?`<span>${ic(k,i,28)}${p.n} ×${inv[k][i]}</span>`:'')).join('');$('sh').innerHTML=h||'Пока пусто. Части выпадают с врагов и из рандомайзера.'}
function hud(){$('l').textContent='❤ '+lives;$('e').textContent='🧬 '+Math.floor(en);$('wv').textContent='Волна '+wave;
$('go').textContent=over?'Заново':run?'Идёт волна…':'Начать волну '+(wave+1);$('go').disabled=run&&!over;$('tb').style.display=selT?'flex':'none';$('rb').textContent=rn?'Выбери одну из трёх частей':rolls>0?'Рандомайзер (бесплатно ×'+rolls+')':'Рандомайзер · '+RC+' 🧬';$('rb').disabled=!!rn||(rolls<1&&en<RC);
const z=selT?selT.st:st(sel);
$('info').textContent=(selT?'Выбранная башня':'Новая башня '+BASE)+' · урон '+z.d.toFixed(1)+' · '+(1/z.cd).toFixed(1)+' уд/с · дальность '+z.r.toFixed(1)+'. Тап по башне выбирает её: на неё можно ставить части.'}
function reset(){lives=20;en=120;wave=0;run=false;over=false;E=[];T=[];S=[];q=0;sp=0;selT=null;rolls=1;rn=null;sel={brain:0,spine:0,strike:0,nerve:0};inv={};L.forEach(k=>inv[k]=P[k].map((_,i)=>i?0:Infinity));shop();showRn();names();hud()}
$('rows').innerHTML=L.map(k=>`<div class="row"><b>${LN[k]}</b><button data-k="${k}" data-d="-1">‹</button><span id="n${k}"></span><button data-k="${k}" data-d="1">›</button></div>`).join('');
function names(){const s=selT?selT.sel:sel;L.forEach(k=>$('n'+k).innerHTML=ic(k,s[k],26)+' '+P[k][s[k]].n+(!selT&&s[k]?' ×'+inv[k][s[k]]:''))}
$('rows').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,n=P[k].length,d=+b.dataset.d,s=selT?selT.sel:sel,cur=s[k];let i=cur;do i=(i+d+n)%n;while(i!=cur&&!inv[k][i]);
if(selT){if(i!=cur){if(cur)inv[k][cur]++;if(i)inv[k][i]--;s[k]=i;const z=st(s);if(selT.m){z.r*=selT.m.r;z.cd*=selT.m.cd;z.d*=selT.m.d}selT.st=z;shop()}}else s[k]=i;
names();hud()};
c.onclick=e=>{if(over)return;const r=c.getBoundingClientRect(),gx=Math.floor((e.clientX-r.left)/r.width*8),gy=Math.floor((e.clientY-r.top)/r.height*9);
const i=T.findIndex(t=>t.x==gx&&t.y==gy);
if(i>=0){selT=selT==T[i]?null:T[i];names();hud();return}
if(selT){selT=null;names();hud();return}
if(pc.has(gx+','+gy)||BASE>en)return;
const m=Math.random()<.25?MUT[Math.random()*3|0]:null,z=st(sel);if(m){z.r*=m.r;z.cd*=m.cd;z.d*=m.d}
T.push({x:gx,y:gy,m,sel:{...sel},cd:0,st:z});en-=BASE;L.forEach(k=>{if(sel[k]&&--inv[k][sel[k]]<1)sel[k]=0});shop();names();hud()};
$('go').onclick=()=>{if(over){reset();return}if(run)return;wave++;q=5+wave*2;sp=0;run=true;hud()};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hit(e,d,t,f=1){let v=d*f;if(t.st.nk=='crit'&&Math.random()<.25)v*=2.5;e.hp-=v;if(t.st.nk=='slow')e.sl=1.5;if(t.st.k=='poison'){e.po=3;e.pd=Math.max(e.pd,d*1.4)}}
function beam(a,b,col){S.push({a:[a.x,a.y],b:[b.x,b.y],t:.12,c:col})}
function fire(t,tg){const k=t.st.k,col=SC[t.sel.strike];beam({x:t.x+.5,y:t.y+.5},tg,col);hit(tg,t.st.d,t);
if(k=='splash')E.forEach(o=>{if(o!=tg&&dist(o,tg)<1)hit(o,t.st.d,t,.7)});
if(k=='chain'){let p=tg;const u=[tg];for(let i=0;i<2;i++){const n=E.filter(o=>!u.includes(o)&&dist(o,p)<1.8).sort((a,b)=>dist(a,p)-dist(b,p))[0];if(!n)break;beam(p,n,col);hit(n,t.st.d,t,.7);u.push(n);p=n}}}
function upd(dt){if(over)return;
if(run&&q>0&&(sp-=dt)<=0){sp=.7;q--;const big=wave%4==0,h=18*1.17**wave*(big?2.8:1);E.push({d:0,hp:h,m:h,v:(big?.6:1)*(.9+Math.min(wave*.03,.9)),big,sl:0,po:0,pd:0,x:-.5,y:1.5})}
for(const e of E){if(e.po>0){e.po-=dt;e.hp-=e.pd*dt}e.sl=Math.max(0,e.sl-dt);e.d+=e.v*(e.sl>0?.55:1)*dt;[e.x,e.y]=pos(e.d)}
for(const t of T){t.cd-=dt;if(t.cd>0)continue;const o={x:t.x+.5,y:t.y+.5},r=t.st.r,ts=E.filter(e=>dist(e,o)<=r);if(!ts.length)continue;
const m=t.st.t;ts.sort((a,b)=>m=='strong'?b.hp-a.hp:m=='first'?b.d-a.d:dist(a,o)-dist(b,o));
t.cd=t.st.cd;fire(t,ts[0])}
for(let i=E.length-1;i>=0;i--){const e=E[i];if(e.hp<=0){en+=3+wave/3;if(e.big||Math.random()<.08)drop();E.splice(i,1)}else if(e.d>=tot){lives--;E.splice(i,1)}}
S.forEach(s=>s.t-=dt);S=S.filter(s=>s.t>0);
if(lives<=0){lives=0;over=true;run=false}
if(run&&q==0&&!E.length){run=false;en+=10+wave*2;rolls++}
hud()}
function circ(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,7);x.fill()}
function draw(){const k=c.width/8;x.setTransform(k,0,0,k,0,0);x.fillStyle='#1c1a33';x.fillRect(0,0,8,9);
for(let i=0;i<8;i++)for(let j=0;j<9;j++){x.fillStyle=pc.has(i+','+j)?'#4a2f48':'#262244';x.fillRect(i+.03,j+.03,.94,.94)}
for(const t of T){const cx=t.x+.5,cy=t.y+.5;circ(cx,cy,.4,'#2d2750');x.drawImage(IM.strike[t.sel.strike],cx-.3,cy-.3,.6,.6);x.drawImage(IM.brain[t.sel.brain],cx-.4,cy+.05,.3,.3);
if(t.sel.nerve){x.strokeStyle=NC[t.sel.nerve];x.lineWidth=.07;x.beginPath();x.arc(cx,cy,.4,0,7);x.stroke()}
if(t.m){x.font='.3px sans-serif';x.fillText(t.m.e,t.x+.04,t.y+.3)}}
if(selT){x.strokeStyle='#fff';x.lineWidth=.04;x.beginPath();x.arc(selT.x+.5,selT.y+.5,selT.st.r,0,7);x.stroke();x.lineWidth=.07;x.beginPath();x.arc(selT.x+.5,selT.y+.5,.46,0,7);x.stroke()}
for(const e of E){circ(e.x,e.y,e.big?.38:.26,e.po>0?'#7bd957':e.sl>0?'#6bb8e8':'#e8655f');x.fillStyle='#000';x.fillRect(e.x-.25,e.y-.42,.5,.07);x.fillStyle='#5de0b0';x.fillRect(e.x-.25,e.y-.42,.5*Math.max(0,e.hp/e.m),.07)}
for(const s of S){x.strokeStyle=s.c;x.lineWidth=.06;x.beginPath();x.moveTo(s.a[0],s.a[1]);x.lineTo(s.b[0],s.b[1]);x.stroke()}
if(over){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,8,9);x.fillStyle='#fff';x.font='bold .6px sans-serif';x.textAlign='center';x.fillText('Конец · волна '+wave,4,4.6);x.textAlign='left'}}
function rs(){const d=devicePixelRatio||1;c.width=Math.round(c.clientWidth*d);c.height=Math.round(c.width*9/8)}
addEventListener('resize',rs);
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;upd(dt);draw();requestAnimationFrame(loop)}
reset();rs();requestAnimationFrame(loop);
</script></body></html>
