<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Spire: башни и артефакты</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eeed;--panel:#fff;--ink:#14242c;--mute:#5a6d76;--line:#c6d2d0;--acc:#0b8a79;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1318;--panel:#12212a;--ink:#e5eeed;--mute:#8aa0a8;--line:#24404a;--acc:#3dd6bf;--accink:#08201c}}
:root[data-theme="dark"]{--bg:#0a1318;--panel:#12212a;--ink:#e5eeed;--mute:#8aa0a8;--line:#24404a;--acc:#3dd6bf;--accink:#08201c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 "Bricolage Grotesque",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:1000px;padding:10px;display:flex;flex-direction:column;gap:8px}
#top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#hud{display:flex;gap:6px 14px;font-weight:700;flex:1 1 200px;font-size:17px;flex-wrap:wrap;align-items:center}
canvas{width:100%;height:auto;border-radius:10px;display:block;touch-action:manipulation;background:#0f1f27}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.btn.dim{opacity:.45}
.btn.main{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.gem:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.gem{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--g);font:700 16px "Bricolage Grotesque",system-ui,sans-serif;color:#10222a;cursor:pointer}
.gem.e{background:transparent;border-style:dashed;cursor:default}
.gem.on{outline:3px solid var(--ink);outline-offset:2px}
.hint{color:var(--mute);font-size:14px;min-height:38px}
#ov{position:fixed;inset:0;background:rgba(5,12,16,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov[hidden]{display:none}
#ov .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px}
#ov h2{margin:0;font-size:22px}
.pick{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.pick .gem{flex:none;cursor:inherit}
.pick small{display:block;color:var(--mute);font-weight:500}

:root{padding-top:0;padding-bottom:0}
html,body{overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;padding:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px));gap:6px}
#wrap{flex:1 1 0;min-height:0;min-width:0;position:relative;overflow:hidden;contain:layout paint;touch-action:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0;touch-action:none}
#top{flex:none}
.panel{flex:none;max-height:25%;overflow-y:auto;overscroll-behavior:contain}
.btn{min-height:44px}
.gem{width:44px;height:44px;flex:none}
#ov{padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#ov .box{max-height:100%;overflow-y:auto}
@media (max-width:640px){
 #hud{flex-basis:100%;font-size:15px;gap:4px 12px}
 #go{flex:1}
 .hint{min-height:0;font-size:13px}
 .panel{max-height:25%;flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:6px 8px;padding:6px}
 #tp{flex-basis:100%}
}
@media (orientation:landscape) and (max-height:520px){
 #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:auto minmax(0,1fr);column-gap:8px;row-gap:6px}
 #wrap{grid-column:1;grid-row:1/3}
 #top{grid-column:2;grid-row:1}
 .panel{grid-column:2;grid-row:2;max-height:none;flex-direction:column;flex-wrap:nowrap;gap:8px;padding:10px}
 #hud{flex-basis:100%;font-size:15px}
 #go{flex:1}
 .hint{min-height:0;font-size:13px}
}

/* fixed layout */
#top{height:50px;flex-wrap:nowrap;overflow:hidden;gap:6px}
#hud{flex:1 1 0;min-width:0;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;font-size:16px;gap:12px}
.nx{font-size:12px;color:var(--mute);font-weight:500;overflow:hidden;text-overflow:ellipsis}
#top .btn{flex:none;height:46px;min-width:48px;padding:0 12px}
#go{flex:none;min-width:92px;white-space:nowrap}
#evb{display:none}#evb.show{display:block}
.panel{height:clamp(214px,32dvh,270px);max-height:none;overflow:hidden;display:grid;grid-template-rows:54px 46px minmax(0,1fr);gap:6px;padding:8px;flex-direction:initial;flex-wrap:initial}
#bl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#bl .btn{min-height:0;height:54px;padding:2px;font-size:13px;line-height:1.15}
#inv{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;align-items:center}
#tp{flex-basis:auto;overflow-y:auto;overflow-x:hidden;min-height:0;font-size:13px;line-height:1.3}
#tp .row{overflow-x:auto;overflow-y:hidden}
#tp .btn{min-height:44px;padding:0 10px;font-size:13px;white-space:nowrap;flex:none}
@media (max-width:640px){.nx{display:none}.panel{flex-direction:initial;flex-wrap:initial}}
@media (orientation:landscape) and (max-height:520px){#top{height:auto;flex-wrap:wrap;overflow:visible}#hud{flex-basis:100%}#go{flex:1}.panel{height:auto;min-height:0}.nx{display:inline}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div id="hud"></div><button class="btn main" id="evb" data-rd="1" title="Эволюция">★</button><button class="btn" id="ps" title="Пауза (P)" aria-label="Пауза">⏸</button><button class="btn" id="spd" title="Скорость (F)">x1</button><button class="btn main" id="go">Старт волны</button></div>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div class="panel">
    <div class="row" id="bl"></div>
    <div class="row" id="inv"></div>
    <div id="tp" class="hint"></div>
  </div>
</div>
<div id="ov" hidden><div class="box" id="ob"></div></div>

  if(e.st>0){x.strokeStyle='#6ec6ff';x.lineWidth=2;x.beginPath();x.arc(p[0],p[1],rr+2,0,7);x.stroke()}
  if(e.pt>0){x.strokeStyle='#9be15d';x.lineWidth=2;x.beginPath();x.arc(p[0],p[1],rr+5,0,7);x.stroke()}
  const by=p[1]-cs*sc*.42;x.fillStyle='#000';x.fillRect(p[0]-12,by,24,4);
  x.fillStyle='#5be37d';x.fillRect(p[0]-12,by,24*Math.max(0,e.hp/e.mx),4);
 }
 for(const p of g.pr){
  if(p.t.type=='arrow'){const fw=[8,15,22][p.lv],f=Math.floor(tm/60)%3;x.save();x.translate(p.x,p.y);x.rotate((p.a===undefined?-1.5708:p.a)+1.5708);spr('p1_'+p.lv,f*fw,0,fw,40,-fw*.45,-18,fw*.9,36);x.restore()}
  else if(p.t.type=='frost')spr('p2_'+p.lv,Math.floor(tm/60)%5*32,0,32,32,p.x-16,p.y-16,32,32);
  else{const q=PF[p.t.type][p.lv],fw=q[0],fh=q[1];spr((p.t.type=='bow'?'p3_':'p4_')+p.lv,Math.floor(tm/70)%q[2]*fw,0,fw,fh,p.x-fw,p.y-fh,fw*2,fh*2)}
 }
 for(const f of g.fx){
  const pr=1-f.t/f.T;
  if(f.k=='b'){x.globalAlpha=f.t*1.2;x.fillStyle=f.c;x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill();x.globalAlpha=1}
  else if(f.k=='g'){x.globalAlpha=Math.min(1,f.t*2);x.fillStyle='#ffd23f';x.font='700 12px sans-serif';x.fillText('+'+f.v,f.x-8,f.y-12-(.8-f.t)*30);x.globalAlpha=1}
  else if(f.k=='i'){const d=64*f.sc;if(f.ty=='arrow')spr('im1',Math.min(5,Math.floor(pr*6))*64,0,64,64,f.x-d/2,f.y-d/2,d,d);else{const IK={frost:['im2_',WM[f.lv].im],bow:['im3_',6],cat:['im4_',9]}[f.ty],n=IK[1];spr(IK[0]+f.lv,Math.min(n-1,Math.floor(pr*n))*64,0,64,64,f.x-d/2,f.y-d/2,d,d)}}
  else if(f.k=='x'){const M=EN[f.kind],cs=M.cs,sc=M.sc*f.big,dr=f.dir||{r:0,fl:0};x.save();x.translate(f.x,f.y);if(dr.fl)x.scale(-1,1);spr(f.kind,Math.min(M.d-1,Math.floor(pr*M.d))*cs,(6+dr.r)*cs,cs,cs,-cs*sc/2,-cs*sc/2,cs*sc,cs*sc);x.restore()}
  else if(f.k=='c')spr('coll',Math.min(15,Math.floor(pr*16))*208,0,208,192,f.x-104*K,f.y-192*K+6,208*K,192*K);
  else if(f.k=='p')spr('cons',Math.min(4,Math.floor(pr*5))*192,1280,192,256,f.x-96*K,f.y-192*K,192*K,256*K);
  else if(f.k=='l'){x.strokeStyle='#5eead4';x.lineWidth=2;x.beginPath();x.moveTo(f.x,f.y);x.lineTo(f.x2,f.y2);x.stroke()}
 }
 if(g.pause){x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,C*S,R*S);x.fillStyle='#fff';x.font='700 28px sans-serif';x.textAlign='center';x.fillText('Пауза',C*S/2,R*S/2);x.textAlign='left'}
}

let last=performance.now();
function loop(n){
 const dt=Math.min(.05,(n-last)/1000)*g.spd;last=n;
 upd(dt);draw();
 if(sig()!=lastGold)ui();
 requestAnimationFrame(loop);
}
Promise.all(Object.keys(SP).map(k=>new Promise(r=>{const i=new Image();i.onload=r;i.src=SP[k];IM[k]=i}))).then(()=>{init();requestAnimationFrame(loop)});
</script>
