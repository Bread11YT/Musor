body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.25 'Pixelify Sans','Courier New',monospace;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:420px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.pn,.bt{border:8px solid transparent;border-image:var(--pn) 8 fill/8px;image-rendering:pixelated}
.bt{cursor:pointer;text-align:center;padding:2px 4px}
.bt:active,.bt.on{border-image-source:var(--pr)}
.bt.off{border-image-source:var(--of);color:#8a8a80}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sp{--z:1;display:inline-block;flex:none;width:calc(32px*var(--z));height:calc(32px*var(--z));background:var(--emo) calc(var(--c)*-32px*var(--z)) calc(var(--r)*-32px*var(--z))/calc(160px*var(--z)) calc(608px*var(--z));image-rendering:pixelated;vertical-align:middle}
.x2{--z:2}.x3{--z:3}
.xpb{height:12px;background:#0003;border:2px solid var(--ink);margin-top:-2px}.xpb i{display:block;height:100%;background:#e9b44c;width:0}
#field{display:grid;grid-template-columns:repeat(3,96px);gap:4px;justify-content:center;padding:10px 0;background:var(--bg2);border-radius:8px}
.plot{position:relative;width:96px;height:96px;cursor:pointer}
.plot .sp{position:absolute;left:0;top:0}
.plot.wet .soil{filter:brightness(.68) saturate(1.3)}
.plot.lock .soil{filter:grayscale(.4) brightness(.85)}
.plot.far{opacity:.5}
.plot .wd{left:32px;top:30px;display:none}
.crop.ripe{animation:bob .7s steps(2) infinite}
.crop.gold{filter:drop-shadow(0 0 5px #ffd84a) saturate(1.7) brightness(1.15)}
@keyframes bob{50%{transform:translateY(-6px)}}
.bar{position:absolute;left:14px;right:14px;bottom:6px;height:10px;background:#0005;border:2px solid var(--ink);display:none}
.bar i{display:block;height:100%;background:#b6e04f;width:0}
.lk,.pop{position:absolute;left:0;right:0;text-align:center;color:#fff;font-weight:700;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);pointer-events:none}
.lk{top:34px}.pop{top:14px;animation:up .8s forwards}
@keyframes up{to{transform:translateY(-34px);opacity:0}}
#seeds{display:flex;flex-wrap:wrap;gap:6px}
#seeds .bt{flex:1 0 calc(20% - 6px);min-width:0;display:flex;flex-direction:column;align-items:center;font-size:12px;padding:2px 0}
#msg{min-height:20px;text-align:center;color:#fff6dc;font-weight:700;text-shadow:1px 1px 0 var(--ink)}
.cap{font-size:13px;color:#fff6dc;text-shadow:1px 1px 0 var(--ink);margin:0 2px -4px}
#title,#win{position:fixed;inset:0;background:var(--bg);z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;color:#fff6dc;text-shadow:2px 2px 0 var(--ink)}
#title{display:flex}#win{display:none}
h1{margin:0;font-size:46px;line-height:1}
#play{width:270px;height:81px;background:var(--p1) 0 0/100% 100%;image-rendering:pixelated;cursor:pointer}
#play:active{background-image:var(--p2)}

  b.style.display=p.k&&!rp?'block':'none';b.firstChild.style.width=p.g*100+'%'});
 [...$('seeds').children].forEach(el=>{const k=el.dataset.k,c=CR[k];el.className='bt'+(S.lvl<c.l?' off':'')+(S.sel==k?' on':'');el.lastChild.textContent=S.lvl<c.l?'ур.'+c.l:c.s});
 set($('bun'),o?`<div class="row">${E(2,(S.inv[o.k]||0)>=o.n?5:4,2)}<div style="flex:1">Привет! Мне нужно:<br><b>${E(CR[o.k].c,CR[o.k].r)}×${o.n}</b> → <b>${o.rew}</b>${E(1,8)}+${E(4,8)}</div><div class="bt ${(S.inv[o.k]||0)>=o.n?'':'off'}" data-give="1">Отдать</div></div>`:`<div class="row">${E(2,4,2)}<div style="flex:1">Зайчик думает, что бы заказать…</div></div>`);
 const items=K.filter(k=>S.inv[k]>0).map(k=>`<span>${E(CR[k].c,CR[k].r)}×${S.inv[k]}</span>`).join('')||'<span>Склад пуст — собери урожай</span>',v=sellVal();
 set($('inv'),`<div style="font-size:13px;margin-bottom:4px">${S.hot?'Спрос: '+E(CR[S.hot].c,CR[S.hot].r)+' продаётся ×2!':'Спрос обычный'}</div><div class="row" style="flex-wrap:wrap;justify-content:flex-start">${items}</div><div class="bt ${v?'':'off'}" data-sell="1" style="margin-top:6px">Продать лишнее ${v?'(+'+v+')':''} · амбар ${tot()}/${cap()}</div>`);
 Object.keys(HC).forEach(h=>{const cost=HC[h].pr[S[h]];$('n_'+h).textContent='×'+S[h];const b=$('b_'+h);set(b,cost?E(1,8)+cost:'макс.');b.className='bt'+(!cost||S.coin<cost?' off':'')})}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-i],[data-k],[data-b],[data-sell],[data-give],[data-reset],[data-mute],#play,#ok');if(!t)return;const d=t.dataset;
 if(t.id=='play'){$('title').style.display='none';started=1;snd(660,.2);toast('Выбери семена и жми на грядку. Поливай — так быстрее растёт!');return}
 if(t.id=='ok'){$('win').style.display='none';return}
 if(d.i!==undefined)tap(+d.i);
 else if(d.k){const c=CR[d.k];if(S.lvl<c.l)return no('Откроется на уровне '+c.l);S.sel=d.k;snd(520)}
 else if(d.b){const h=d.b,cost=HC[h].pr[S[h]];if(!cost)return;if(S.coin<cost)return no('Не хватает монет');S.coin-=cost;S[h]++;snd(700,.2);toast('Куплено: '+HC[h].n)}
 else if(d.sell){const v=sellVal();if(!v)return no('Нечего продавать');S.coin+=v;S.sold+=v;K.forEach(k=>S.inv[k]=Math.min(S.inv[k]||0,rsv(k)));snd(880,.15);toast('Продано на '+v)}
 else if(d.give){const o=S.order;if(!o||(S.inv[o.k]||0)<o.n)return no('Не хватает урожая для заказа');S.inv[o.k]-=o.n;S.coin+=o.rew;S.sold+=o.rew;S.stars++;S.order=null;S.ot=3;snd(990,.25);toast('Зайчик в восторге! +'+o.rew+' и звезда')}
 else if(d.mute){mute^=1;try{localStorage.setItem('sproutm',mute)}catch(e){}if(!mute)snd(520)}
 else if(d.reset){if(d.arm){S=fresh();build();toast('Новая ферма!');snd(59)}else{d.arm=1;snd(58);t.textContent='Точно? Нажми ещё раз';setTimeout(()=>{delete d.arm;t.textContent='Начать заново'},3000)}}
 U()});
