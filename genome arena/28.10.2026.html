<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Геномная Арена</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1117">
<style>
/* Layout: одноколонный мобильный игровой экран. Липкая шапка с монетами и стадией, нижняя навигация, бой на всю ширину. */
:root{
  --bg:#0d1117; --surface:#151b24; --surface2:#1d2530; --line:#2a3441;
  --fg:#eef2f7; --muted:#8b98a9; --coin:#f4b942; --ink:#161006;
  --fang:#ff6b57; --steel:#5aa9e6; --spore:#9bd04f; --ether:#b78cff;
  --good:#4cc38a; --bad:#f0616d;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:var(--font); --font-body:var(--font); --font-mono:var(--font);
  --pit:#0f141b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-synthesis:none}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14.5px;line-height:1.45;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.logo{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.logo small{display:block;font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-family:var(--font-mono);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.dq-btn{position:relative;width:34px;height:34px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0;color:var(--fg)}
.dq-btn:hover{border-color:var(--muted)}
.dq-dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);box-sizing:content-box}
.in-battle .dq-btn{display:none}
.tp-row{display:flex;gap:8px;margin:6px 0 10px}
.sheet .tp-cell{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;line-height:1.25}
.sheet .tp-cell .art{max-width:52px;margin:0 auto}
.tp-cell.slot{cursor:pointer;min-height:84px}
.tp-cell.empty{border-style:dashed;color:var(--muted);display:grid;place-items:center;cursor:default}
.tp-cell .nm{font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-h{font-size:12px;color:var(--muted);margin:10px 0 0}
.tp-adv{font-family:var(--font-mono);font-size:11px;font-weight:700;margin-top:2px}
.tp-up{color:var(--good)}.tp-dn{color:var(--bad)}
.tp-st{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:2px}
.mc .tpn{display:none}.mc.sel .tpn{display:block}
.sheet .tp-grid .art{max-width:74px}
.tp-grid .mc{padding:6px 4px 6px}
.tp-grid .nm{font-size:12px}
.tp-bar{position:sticky;bottom:-16px;margin:12px -16px -16px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;z-index:3}
.tp-bar .btn{flex:1}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:6px}
.sd{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 0;text-align:center;line-height:1.2}
.sd small{display:block;font-size:11px;color:var(--muted)}
.sd b{font-family:var(--font-mono);font-size:12px}
.sd.got{opacity:.5}
.sd.got b::after{content:" ✓";color:var(--good)}
.sd.now{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin);opacity:1}
.dqs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.dqs li{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dqs .dq-main{flex:1;min-width:0}
.dqs .dq-main b{font-size:14.5px}
.dqs .xp{margin:6px 0 0}
.dq-got{color:var(--good);font-size:12px;font-weight:700;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--coin)}
.chip.stage i{background:var(--fang);border-radius:2px;transform:rotate(45deg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.h{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

.btn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:600;font-size:14.5px;min-height:44px;transition:transform .08s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--coin);color:var(--ink);border-color:var(--coin);font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.btn.on{border-color:var(--coin);color:var(--coin)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.price{font-family:var(--font-mono);font-weight:700}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gridm{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}

.mc{position:relative;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 6px 8px;text-align:center;cursor:pointer}
.mc.empty{display:grid;place-items:center;min-height:130px;color:var(--muted);font-size:12px;border-style:dashed;cursor:default}
.mc.sel{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.art{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;background:radial-gradient(closest-side at 50% 62%,color-mix(in srgb,var(--c1) 38%,transparent),transparent 100%),var(--pit);overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.nm{font-weight:600;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{position:absolute;top:4px;left:4px;z-index:2;font-family:var(--font-mono);font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.badge.boss{background:var(--bad);color:var(--ink);border-color:var(--bad)}

.gene{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11px;font-weight:700}
.gene::before{display:none}
.gi{display:inline-block;vertical-align:-3px;flex:none}
.cycle{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted)}
.cycle b{font-family:var(--font-mono);font-weight:500}

/* бой */
.battle{margin-top:14px}
.field{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:6px 0}
.field::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--line)}
.field::after{content:"VS";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);padding:6px 4px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col.left{align-items:flex-start}
.col.right{align-items:flex-end}
.col .unit{width:min(100%,118px)}
.col.left .unit:nth-child(2){margin-left:min(14%,26px)}
.col.right .unit:nth-child(2){margin-right:min(14%,26px)}
.unit{position:relative;min-width:0;padding:14px 0 0;text-align:center;transition:opacity .3s}
.unit .art{background:none;overflow:visible;border-radius:0}
.unit .bar{width:78%;height:7px;margin:0 auto}
.unit .nm{margin-top:4px;font-size:12px}
.unit .stat-row{justify-content:center;gap:8px}
.unit::before{content:"";position:absolute;left:50%;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid transparent;transform:translateX(-50%);transition:border-top-color .15s}
.unit .art svg{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.unit:nth-child(2) .art svg{animation-delay:-.9s}
.unit:nth-child(3) .art svg{animation-delay:-1.7s}
.unit.dead{opacity:.28;filter:grayscale(1)}
.unit.dead .art svg{animation:none}
.unit.cur::before{border-top-color:var(--coin)}
.unit.cur .art svg{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--coin) 70%,transparent))}
.unit.tgt{cursor:pointer}
.unit.tgt::before{border-top-color:var(--bad)}
.unit.tgt .art svg{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--bad) 75%,transparent))}
.unit.hit .art{animation:shake .3s}
.unit.lunge-a{animation:lungea .4s}
.unit.lunge-f{animation:lungef .4s}
.bar{height:6px;background:var(--pit);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:100%;background:var(--good);transition:width .4s,background .4s}
.bar i.mid{background:var(--coin)}.bar i.low{background:var(--bad)}
.stat-row{display:flex;justify-content:space-between;gap:4px;margin-top:3px;font-family:var(--font-mono);font-size:11px;color:var(--muted);min-height:15px}
.stat-row .pz{color:var(--spore)}
.pop{position:absolute;left:50%;top:26%;z-index:3;font-family:var(--font-mono);font-weight:700;font-size:19px;pointer-events:none;text-shadow:0 1px 0 #000,0 0 6px #000;animation:rise .95s ease-out forwards}
.pop.dm{color:#fff}.pop.up{color:var(--coin)}.pop.down{color:var(--muted)}.pop.hl{color:var(--good)}.pop.pz{color:var(--spore)}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;text-align:center}
.mid .rd{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mid .lg{font-size:14.5px;min-height:21px;font-weight:500}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:12px 0 8px;min-height:20px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl .btn small{display:block;font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--muted)}
body.in-battle .tabs{display:none}
[hidden]{display:none!important}

/* нижняя навигация */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:560px;margin:0 auto;display:flex;gap:4px}
.tab{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:10px;padding:10px 2px;font-family:var(--font-display);font-weight:500;font-size:11px;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;color:var(--muted)}
.tab.on{background:var(--surface2);border-color:var(--line);color:var(--fg)}

/* окна */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,9,13,.8);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:440px;max-height:88dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;animation:up .22s ease-out}
.sheet .art{max-width:190px;margin:0 auto}
.sheet h3{font-family:var(--font-display);font-weight:700;font-size:16px;margin:12px 0 6px;text-align:center;text-wrap:balance}
.center{text-align:center}
.atabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.atabs button{display:grid;justify-items:center;gap:4px;padding:9px 2px 8px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.02em;min-width:0}
.atabs button svg{width:22px;height:22px}
.atabs button.on{background:var(--surface2);border-color:var(--coin);color:var(--coin);box-shadow:inset 0 -2px 0 var(--coin)}
.streak{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.streak-top{display:grid;gap:2px}
.streak-top b{font-family:var(--font-display);font-size:14.5px}
.streak-top span{font-size:12px;color:var(--coin);font-family:var(--font-mono)}
.pips{display:flex;gap:4px;margin-top:8px}
.pips i{flex:1;height:8px;border-radius:4px;background:var(--pit)}
.pips i.on{background:var(--coin)}
.tstats,.rstats{display:grid;gap:8px;margin:4px 0 12px}
.tstats{grid-template-columns:repeat(3,1fr)}
.rstats{grid-template-columns:1fr 1fr}
.tstats div,.rstats div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.tstats b,.rstats b{display:block;font-family:var(--font-mono);font-size:19px;font-variant-numeric:tabular-nums}
.rstats b.coinv{color:var(--coin)}
.tstats span,.rstats span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--surface2);border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--font-mono);font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.xp{height:6px;background:var(--pit);border-radius:3px;overflow:hidden;margin:4px 0 12px}
.xp i{display:block;height:100%;background:var(--steel)}
.new{display:inline-block;background:var(--coin);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:5px}
.list{margin:8px 0 14px;padding:0;list-style:none;display:grid;gap:4px;font-size:14.5px}
.list b{font-family:var(--font-mono)}

/* лаборатория */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:12px}
.pair .x{font-family:var(--font-mono);color:var(--muted);text-align:center;font-size:18px}
.codex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cx{display:flex;align-items:center;gap:8px;min-width:0;background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:13px}
.cx .gp{display:flex;gap:3px;flex:none}
.cx .gp i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.cx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx.lock{color:var(--muted)}

/* бинго */
.bingo{display:grid;grid-template-columns:20px repeat(5,minmax(0,1fr));gap:4px;align-items:stretch}
.bh{display:grid;place-items:center;min-height:20px}
.bh .gi{vertical-align:middle}
.bc{min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 3px 4px;text-align:center}
.bc .art{border-radius:6px}
.bc .nm{font-size:11px;margin-top:3px;line-height:1.2}
.bc.lock .art svg{filter:brightness(0) opacity(.3)}
.bc.lock .nm{color:var(--muted);font-weight:500}
.bc.won{border-color:var(--bwc,var(--coin));box-shadow:inset 0 0 0 1px var(--bwc,var(--coin))}
.seg5{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg5 button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:12px;display:grid;place-items:center;padding:0 2px}
.seg5 button.on{border-color:var(--coin);color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.rwlist{display:grid;gap:8px}
.rw{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.rw.done{border-color:var(--coin)}
.rw-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rw-top b{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.02em}
.rw.done .rw-top .meta{color:var(--coin)}
.bingo-note{margin:12px 0;background:var(--surface2);border:1px solid var(--coin);border-radius:10px;padding:12px}
.shop .btn.buy{margin-top:8px;width:100%;min-height:38px;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:6px}
.shop .btn.buy::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--coin)}
.shop.lock .art svg{filter:brightness(0) opacity(.35)}
.shop .meta{display:flex;flex-wrap:wrap;gap:2px 8px;justify-content:center;margin-top:2px}

.tab{font-size:11px;letter-spacing:.02em;padding:10px 1px}
@media (max-width:359px){.tab{font-size:11px;letter-spacing:0}}
/* рейтинг */
.lb{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.lb li{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.lb .pos{flex:none;width:28px;font-family:var(--font-mono);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lb li:nth-child(1) .pos{color:var(--coin)}
.lb li:nth-child(2) .pos{color:#c9d3dc}
.lb li:nth-child(3) .pos{color:#d98e55}
.lb .who{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .sc{flex:none;font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--coin);font-variant-numeric:tabular-nums}
/* звёздные тиры */
.t1{--tc:#cd7f32}.t2{--tc:#c9d3dc}.t3{--tc:#ffd24d}.t4{--tc:#8fe8ff}
.mc.tiered{border-color:var(--tc)}
.mc.tiered .art{box-shadow:inset 0 0 0 2px var(--tc)}
.mc.t4 .art{box-shadow:inset 0 0 0 2px var(--tc),0 0 12px color-mix(in srgb,var(--tc) 60%,transparent)}
.tstar{position:absolute;top:5px;right:5px;z-index:2;line-height:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.mc.dim{opacity:.45}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:14.5px}
.seg button.on{border-color:var(--coin);color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.tk{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.tk .info{flex:1;min-width:0}
.tk .info b{display:block;font-size:14.5px}
.tk .info span{font-size:12px;color:var(--muted)}
.tk .own{font-family:var(--font-mono);font-weight:700;min-width:28px;text-align:right}
.tk .btn.buy{min-height:40px;padding:6px 12px}
.starwrap{display:grid;justify-items:center;gap:3px}
.starwrap span{font-size:11px;line-height:1;color:var(--coin);font-weight:700}
.starbtn{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1.5px dashed var(--coin);display:grid;place-items:center;padding:0;color:var(--coin);justify-self:center}
.starbtn.on{border:1.5px solid var(--tc);box-shadow:0 0 0 1px var(--tc);color:var(--fg)}
.tk.tap{cursor:pointer}
.tk.on{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.stars-sel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 10px}
.stars-sel .btn{display:grid;gap:2px;justify-items:center;padding:8px 4px;min-height:54px}
.stars-sel small{font-size:11px;color:var(--muted)}
.stars-sel .btn.on{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.stars-sel .btn.on small:last-child{color:var(--fg);font-weight:700}
/* кнопка «кто кого бьёт» и окно с кругом */
.chartbtn{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;padding:0;color:var(--muted)}
.chartbtn:hover{border-color:var(--muted)}
.panel.has-chart{position:relative}
.panel.has-chart>.chartbtn{position:absolute;top:10px;right:10px}
.battle{position:relative}
.battle>.chartbtn{position:absolute;top:2px;right:0;z-index:6}
.battle .mid{padding-left:36px;padding-right:36px}
/* экран боя: всё на одном экране, кнопки закреплены внизу */
.battle{margin-top:6px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.battle .mid{padding:2px 0;gap:2px}
.battle .mid .lg{min-height:18px;font-size:13px}
.battle .field{gap:10px;padding:2px 0}
.battle .col{gap:4px}
.battle .unit{padding-top:8px}
body.in-battle .top{display:none}
.battle .unit .art{width:clamp(44px,calc(33.3vh - 146px),110px);width:clamp(44px,calc(33.3dvh - 146px),110px);margin:0 auto}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.dock>*{max-width:560px;margin-left:auto;margin-right:auto}
.dock .hint{margin:0 0 6px;min-height:18px;font-size:12px}
.dock .ctrl{gap:6px}
.dock .ctrl .btn[data-act="auto"],.dock .ctrl .btn[data-act="retreat"]{padding:6px;font-size:12px;min-height:34px}
.dock.off{display:none}
/* ползунок прокрутки: показывает, что страницу можно листать */
.sb{position:fixed;right:3px;width:5px;z-index:8;border-radius:3px;background:rgba(255,255,255,.08);pointer-events:none}
.sb i{display:block;width:100%;border-radius:3px;background:var(--coin);opacity:.85;box-shadow:0 0 6px rgba(255,200,87,.35)}
.sb-sheet{z-index:25;width:4px;right:auto}
/* слой эффектов атак */
.fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.fxe{position:absolute;pointer-events:none;will-change:transform,opacity}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,.98)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-38px)}}
@keyframes lungea{40%{transform:translateX(18px)}}
@keyframes lungef{40%{transform:translateX(-18px)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:520px){.overlay{align-items:center}}

.top .chips{flex-wrap:nowrap;gap:6px}.top .logo{min-width:0}
</style>
<style id="modern">
/* ===== Современная тема: чистые панели, системный шрифт, пиксели только в арте мутантов ===== */
body{font-size:15px;line-height:1.45;letter-spacing:0;-webkit-font-smoothing:antialiased}
.app{padding-bottom:92px}
p{line-height:1.45}
/* шапка */
.top{padding:10px 0;border-bottom:0;gap:8px}
.top .logo{font-size:18px;font-weight:700;letter-spacing:-.01em;text-transform:none;line-height:1.15;white-space:nowrap}
.top .logo small{display:none}
.top .chips{gap:6px}
.chip{border-radius:999px;padding:5px 11px;font-size:13px;font-weight:650;gap:6px}
.dq-btn{width:36px;height:36px;border-radius:12px}
/* панели и текст */
.panel{border-radius:16px;padding:16px;margin-top:12px}
.h{font-size:16px;font-weight:700;letter-spacing:0;text-transform:none;margin:0 0 6px}
.sub{font-size:13px;line-height:1.45;margin:0 0 12px;color:var(--muted)}
.panel.has-chart>.sub{padding-right:44px}
/* кнопки */
.btn{border-radius:12px;font-size:14px;font-weight:600;min-height:46px;padding:10px 14px}
.btn.primary{font-size:15px;font-weight:700;letter-spacing:0;text-transform:none}
.btn small{font-size:11px}
.btn.primary[disabled]{background:var(--surface2);border-color:var(--line);color:var(--muted);opacity:1}
/* карточки мутантов */
.mc{border-radius:14px;padding:8px 8px 10px}
.art{border-radius:12px}
.nm{font-size:13.5px;font-weight:600;margin-top:8px}
.meta{font-size:12px}
.tstats b,.rstats b,.stats b{font-size:20px;font-weight:700}
.tstats span,.rstats span,.stats span{font-size:12px}
.tstats div,.rstats div,.stats div{border-radius:12px;padding:10px 6px}
.badge{font-size:11px;border-radius:6px}
/* переключатель разделов арены: одна компактная строка */
.atabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 2px}
.atabs button{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:11px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:650;letter-spacing:0;min-width:0;box-shadow:none}
.atabs button svg{width:16px;height:16px;flex:none}
.atabs button.on{background:var(--surface2);color:var(--fg);box-shadow:none}
.atabs button.on svg{color:var(--coin)}
/* нижняя навигация */
.tabs{background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{gap:2px}
.tab{display:grid;justify-items:center;gap:3px;padding:4px 0 2px;border:0;border-radius:12px;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);background:none}
.tab .ti{display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background .15s,color .15s}
.tab .ti svg{width:22px;height:22px}
.tab.on{background:none;border:0;color:var(--fg)}
.tab.on .ti{background:color-mix(in srgb,var(--coin) 24%,transparent);color:var(--coin)}
/* окна */
.overlay{background:rgba(4,7,11,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{border-radius:20px;padding:18px 16px 16px}
.sheet h3{font-size:18px;font-weight:700;margin:10px 0 6px}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 8px}
.new{border-radius:999px;font-size:11px;letter-spacing:.06em;padding:4px 10px}
.list{font-size:14.5px}
/* бой */
.field::after{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.mid .rd{font-size:11px;letter-spacing:.08em}
.mid .lg{font-size:14px}
.pop{font-size:19px}
.dock .hint{font-size:12.5px}
.tp-h{font-size:12.5px}
/* списки */
.lb li,.dqs li,.rw,.tk,.streak{border-radius:12px}
.seg button,.seg5 button{border-radius:12px;font-size:14px}
.cx{font-size:13px}
.sb{background:rgba(255,255,255,.08)}
</style>

  document.addEventListener('visibilitychange', function () {
    if (!ctx) return;
    try { if (document.hidden) ctx.suspend(); else ctx.resume(); } catch (e) {}
  });
  function ready() { if (!on || !ctx) return false; if (ctx.state !== 'running') { try { ctx.resume(); } catch (e) {} return false; } return true; }
  window.Snd = {

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.08);
    },

<script>
/* ---------- ENGINE: чистая логика без DOM ---------- */

  spore: { name: 'Спора', hex: '#9bd04f', hp: 45, atk: 9,  spd: 5, sp: 'Яд',        spDesc: 'Слабый удар и яд на 3 хода',      needsTarget: true  },

};
// кто кого пробивает: Клык > Спора > Эфир > Сталь > Кость > Клык
const BEATS = { fang: 'spore', spore: 'ether', ether: 'steel', steel: 'bone', bone: 'fang' };

  steel: { fang: 'Лязг',      steel: 'Монолит', spore: 'Ржавец',   ether: 'Страж',    bone: 'Саркофаг' },

const STREAK_BASE = [30, 35, 40, 50, 60, 75, 120];                          // награды серии входов, 7-дневный цикл
/* ---------- ЗВЁЗДНЫЕ СЛИЯНИЯ ---------- */
const TIERS = [
  { name: 'Обычный',    color: null,      lvl: 0,   cost: 0 },
  { name: 'Бронзовый',  color: '#cd7f32', lvl: 10,  cost: 150 },    // lvl: с какого уровня родителей можно слить до этого тира
  { name: 'Серебряный', color: '#c9d3dc', lvl: 25,  cost: 500 },    // cost: цена токена в магазине звёзд
  { name: 'Золотой',    color: '#ffd24d', lvl: 50,  cost: 1000 },
  { name: 'Платиновый', color: '#8fe8ff', lvl: 100, cost: 3000 }
];
const TIER_BONUS = 0.25;        // каждый тир: +25% к здоровью и атаке от обычного (серебряный = +50%)
const MERGE_START_LVL = 1;      // с какого уровня начинает мутант после слияния
const tierOf = m => (m && m.tier) || 0;
const BREED_COST = 30, SAMPLE_COST = 40, HYBRID_COST = 90, RELEASE_REFUND = 8, COLLECTION_CAP = 12;
const xpNeed = l => 18 + 8 * l;
/* ---------- ТРЕНИРОВОЧНЫЙ ПОЛИГОН ---------- */
const TRAIN_XP_BASE = 10, TRAIN_XP_PCT = 0.11, TRAIN_LOSE_SHARE = 0.3;   // победа: 10 + 11% от опыта до следующего уровня (по среднему уровню команды); поражение: 30% от награды за победу
const trainAvgLvl = team => { const a = (team || []).filter(Boolean); return a.length ? Math.max(1, Math.round(a.reduce((t, m) => t + m.lvl, 0) / a.length)) : 1; };
const trainWinXp = avg => Math.round(TRAIN_XP_BASE + TRAIN_XP_PCT * xpNeed(avg));
const trainLoseXp = avg => Math.round(trainWinXp(avg) * TRAIN_LOSE_SHARE);
const trainFoeRange = avg => [Math.max(1, avg - 2), Math.max(1, avg - 1)];   // враги полигона: на 1–2 уровня слабее команды, минимум 1
const TRAIN_STREAK_STEP = 0.1, TRAIN_STREAK_CAP = 10;      // каждая победа подряд: +10% к опыту, максимум ×2 (на 10-й победе подряд и дальше)
const trainMult = n => 1 + TRAIN_STREAK_STEP * Math.min(n || 0, TRAIN_STREAK_CAP);   // n = сколько побед подряд уже есть
const fmtMult = x => String(Math.round(x * 10) / 10).replace('.', ',');
function genTrainSpec(team) {
  const [foeLo, foeHi] = trainFoeRange(trainAvgLvl(team));
  const units = [0, 1, 2].map(() => ({
    g: [rndGene(), rndGene()],
    lvl: foeLo + Math.floor(Math.random() * (foeHi - foeLo + 1)),
    gen: 0
  }));
  return { stage: 0, boss: false, train: true, units };
}
const upgradeCost = l => 20 + 12 * l;

/* ---------- ЕЖЕДНЕВНЫЕ ЗАДАНИЯ ---------- */
const DQ_POOL = [
  { t: 'win',     n: 3, base: 60 },
  { t: 'fight',   n: 5, base: 50 },
  { t: 'breed',   n: 2, base: 40 },
  { t: 'upgrade', n: 2, base: 50 }
];
const DQ_NAME = { login: 'Вход в игру', win: 'Выиграй бои на арене', fight: 'Проведи бои', breed: 'Скрести мутантов', upgrade: 'Прокачай мутантов за монеты' };
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };   // цена повышения с уровня l на l+1

function calcStats(m, boost = 1, bonus = null) {
  const a = GENES[m.g[0]], b = GENES[m.g[1]];
  const lv = 1 + 0.18 * (m.lvl - 1), gn = 1 + 0.08 * m.gen;
  const tm = 1 + TIER_BONUS * (m.tier || 0);
  const f = k => (a[k] * 0.65 + b[k] * 0.35) * lv * gn * boost * tm;
  const hpM = bonus ? (bonus.hp[m.g[0]] || 1) * bonus.all : 1;
  const atkM = bonus ? (bonus.atk[m.g[1]] || 1) * bonus.all : 1;
  return {
    hp: Math.round(f('hp') * hpM),
    atk: Math.round(f('atk') * atkM * 10) / 10,
    spd: Math.round((a.spd * 0.65 + b.spd * 0.35) * 10) / 10
  };
}

function breedGenes(a, b) {
  let g1 = a.g[Math.random() < 0.5 ? 0 : 1];
  let g2 = b.g[Math.random() < 0.5 ? 0 : 1];
  let mutated = false;
  if (Math.random() < 0.08) {
    const r = GENE_IDS[Math.floor(Math.random() * GENE_IDS.length)];
    if (Math.random() < 0.5) g1 = r; else g2 = r;
    mutated = true;
  }
  const g = Math.random() < 0.5 ? [g1, g2] : [g2, g1];
  return { g, gen: Math.min(5, Math.max(a.gen, b.gen) + 1), mutated };
}

function addXp(m, x) {
  const ups = [];
  m.xp += x;
  while (m.xp >= xpNeed(m.lvl)) {
    m.xp -= xpNeed(m.lvl);
    m.lvl++;
    ups.push(m.lvl);
  }
  return ups;
}

/* ---------- Враги ---------- */
const rndGene = () => GENE_IDS[Math.floor(Math.random() * GENE_IDS.length)];

function genFoeSpec(stage) {
  const lvl = 1 + Math.floor((stage - 1) * 0.7);
  const gen = Math.min(4, Math.floor(stage / 6));
  const boss = stage % 5 === 0;
  const units = [0, 1, 2].map(i => ({
    g: [rndGene(), rndGene()],
    lvl: Math.max(1, lvl + (boss && i === 1 ? 1 : 0) - (Math.random() < 0.3 ? 1 : 0)),
    gen
  }));
  return { stage, boss, units };
}
const foeBoost = spec => spec.duel ? 1 : (spec.boss ? 1.25 : 1) * (spec.stage < 3 ? 0.85 : 1) * (1 + 0.03 * Math.max(0, spec.stage - 18));

/* ---------- Бой ---------- */
function makeUnit(m, side, idx, boost = 1, tag = '', bonus = null) {
  const st = calcStats(m, boost, bonus);
  return {
    id: side + idx, side, g: m.g, lvl: m.lvl, gen: m.gen, tier: m.tier || 0, ref: m,
    name: speciesName(m.g[0], m.g[1]), tag,
    hp: st.hp, max: st.hp, atk: st.atk, spd: st.spd,
    cd: 2, poison: 0, poisonDmg: 0, alive: true
  };
}

function newBattle(allyMutants, foeSpec, bonus = null, foeBonus = null) {
  const allies = allyMutants.map((m, i) => makeUnit(m, 'a', i, 1, '', bonus));
  const b = foeBoost(foeSpec);
  const foes = foeSpec.units.map((u, i) =>
    makeUnit({ g: u.g, lvl: u.lvl, gen: u.gen, tier: u.tier || 0, xp: 0 }, 'f', i, b, foeSpec.boss && i === 1 ? 'босс' : '', foeBonus));
  return { allies, foes, queue: [], round: 0 };
}

const alive = arr => arr.filter(u => u.alive);
function outcome(B) {
  if (!alive(B.foes).length) return 'win';
  if (!alive(B.allies).length) return 'lose';
  if (B.round > 40) return 'lose';
  return null;
}

function applyDamage(t, d, ev, type, eff) {
  t.hp = Math.max(0, t.hp - d);
  if (t.hp === 0) t.alive = false;
  ev.push({ id: t.id, type, val: d, eff: eff || '' });
}

function nextActor(B) {
  const ev = [];
  for (;;) {
    if (outcome(B)) return { u: null, ev };
    if (!B.queue.length) {
      B.round++;
      if (outcome(B)) return { u: null, ev };
      B.queue = [...alive(B.allies), ...alive(B.foes)]
        .sort((a, b) => (b.spd - a.spd) || (Math.random() - 0.5));
    }
    const u = B.queue.shift();
    if (!u.alive) continue;
    if (u.poison > 0) {
      u.poison--;
      applyDamage(u, u.poisonDmg, ev, 'poison');
      if (!u.alive) continue;
    }
    if (u.cd > 0) u.cd--;
    return { u, ev };
  }
}

function hit(u, t, mult, ev) {
  const eff = BEATS[u.g[0]] === t.g[0] ? 1.25 : (BEATS[t.g[0]] === u.g[0] ? 0.8 : 1);
  const d = Math.max(1, Math.round(u.atk * mult * eff * (0.9 + Math.random() * 0.2)));
  applyDamage(t, d, ev, 'dmg', eff > 1 ? 'up' : eff < 1 ? 'down' : '');
}

function act(B, u, kind, target) {
  const ev = [{ id: u.id, type: 'acts' }];
  const foes = u.side === 'a' ? B.foes : B.allies;
  const mates = u.side === 'a' ? B.allies : B.foes;
  let text;
  if (kind === 'attack') {
    hit(u, target, 1, ev);
    text = `${u.name} бьёт: ${target.name}`;
  } else {
    const g = u.g[0];
    text = `${u.name}: ${GENES[g].sp}`;
    if (g === 'fang') hit(u, target, 2, ev);
    if (g === 'steel') alive(foes).forEach(t => hit(u, t, 0.8, ev));
    if (g === 'spore') {
      hit(u, target, 0.6, ev);
      if (target.alive) {
        target.poison = 3;
        target.poisonDmg = Math.max(1, Math.round(u.atk * 0.4));
        ev.push({ id: target.id, type: 'status' });
      }
    }
    if (g === 'bone') {
      hit(u, target, 1.2, ev);
      const h = Math.min(u.max - u.hp, Math.round(ev[ev.length - 1].val * 0.5));
      if (h > 0) { u.hp += h; ev.push({ id: u.id, type: 'heal', val: h }); }
    }
    if (g === 'ether') {
      const t = alive(mates).sort((x, y) => x.hp / x.max - y.hp / y.max)[0];
      const h = Math.min(t.max - t.hp, Math.round(u.atk * 2.5));
      t.hp += h;
      ev.push({ id: t.id, type: 'heal', val: h });

}

function lineProgress(l, seen) {
  const have = l.cells.filter(k => seen[k]).length;
  return { have, total: l.cells.length, done: have === l.cells.length };
}

function bonusFrom(claimed) {
  const b = { hp: {}, atk: {}, all: 1, breedCost: BREED_COST, coinMult: 1 };
  LINES.forEach(l => {
    if (!claimed || !claimed[l.id]) return;
    if (l.kind === 'row') b.hp[l.gene] = (b.hp[l.gene] || 1) * BINGO_ROW_BONUS;
    if (l.kind === 'col') b.atk[l.gene] = (b.atk[l.gene] || 1) * BINGO_COL_BONUS;
    if (l.kind === 'd1') b.breedCost = 20;
    if (l.kind === 'd2') b.coinMult = 1.1;
    if (l.kind === 'all') b.all = 1.1;
  });
  return b;
}

// выдаёт награды за новые собранные линии, возвращает список этих линий
function checkBingo(state) {
  state.claimed = state.claimed || {};
  const got = [];
  LINES.forEach(l => {
    if (!state.claimed[l.id] && lineProgress(l, state.seen).done) {
      state.claimed[l.id] = 1;
      state.coins += l.coins;
      got.push(l);
    }
  });
  // звёздное бинго: за линию из мутантов тира дают токен этого тира
  [1, 2, 3, 4].forEach(t => {
    if (!state.seenT || !state.claimedT) return;
    state.tokens = state.tokens || {};
    LINES.forEach(l => {
      if (!state.claimedT[t][l.id] && lineProgress(l, state.seenT[t]).done) {
        state.claimedT[t][l.id] = 1;
        state.tokens[t] = (state.tokens[t] || 0) + 1;
        got.push(Object.assign({}, l, { tier: t }));
      }
    });
  });
  return got;
}

/* ---------- РИСУНОК МУТАНТА (SVG из двух генов) ---------- */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  [r, g, b] = [r, g, b].map(x => Math.round((f - x) * p + x));
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

      <circle cx="28" cy="36" r="2" fill="${ol}"/><circle cx="72" cy="36" r="2" fill="${ol}"/>

  } else if (g1 === 'spore') {

    eyes = `<circle cx="40" cy="68" r="5.5" fill="#fff"/><circle cx="60" cy="68" r="5.5" fill="#fff"/>
      <circle cx="41" cy="69" r="2.6" fill="${ol}"/><circle cx="59" cy="69" r="2.6" fill="${ol}"/>`;
  } else if (g1 === 'ether') {

// Вызов кодируется прямо в ссылке (startapp=duel_...), сервер не нужен. Награды за дуэль нет: ссылку можно подделать,
// поэтому результат ни на что не влияет (ни монеты, ни опыт, ни стадия), это просто игра на «кто сильнее».
const DUEL_NAME_MAX = 12;
let duelSpec = null;                         // принятый вызов: { units, bonus, name, duel: true }
const hexOf = t => Array.from(new TextEncoder().encode(t)).map(b => b.toString(16).padStart(2, '0')).join('');
const unhex = h => { try { return new TextDecoder().decode(new Uint8Array((h.match(/../g) || []).map(x => parseInt(x, 16)))); } catch (e) { return ''; } };
function duelCode() {
  const team = S.team.map(byId).filter(Boolean).slice(0, 3);
  if (!team.length) return '';
  const bm = parseInt(LINES.map(l => (S.claimed && S.claimed[l.id]) ? 1 : 0).join('') || '0', 2);   // какие линии бинго собраны: у друга те же бонусы к здоровью и атаке
  const body = team.map(m => GENE_IDS.indexOf(m.g[0]) + '' + GENE_IDS.indexOf(m.g[1]) + Math.min(m.lvl, 1295).toString(36).padStart(2, '0') + Math.min(m.gen || 0, 5) + Math.min(tierOf(m), TIERS.length - 1)).join('');
  const nm = hexOf(((TGU && TGU.first_name) || '').slice(0, DUEL_NAME_MAX));
  return bm.toString(36) + '-' + body + '-' + nm;
}
const duelLink = () => { const c = duelCode(); return c ? `${BOT_LINK}?startapp=duel_${c}` : ''; };
function parseDuel(sp) {
  const mm = /^duel_([0-9a-z]+)-([0-9a-z]{6,18})-([0-9a-f]*)$/.exec(sp || '');
  if (!mm || mm[2].length % 6) return null;
  const units = [];
  for (let i = 0; i < mm[2].length; i += 6) {
    const c = mm[2].slice(i, i + 6);
    const g1 = GENE_IDS[+c[0]], g2 = GENE_IDS[+c[1]], lvl = parseInt(c.slice(2, 4), 36), gen = +c[4], tier = +c[5];
    if (!g1 || !g2 || !(lvl >= 1) || lvl > 999 || !(gen >= 0 && gen <= 5) || !(tier >= 0 && tier < TIERS.length)) return null;
    units.push({ g: [g1, g2], lvl, gen, tier });
  }
  const bits = parseInt(mm[1], 36).toString(2).padStart(LINES.length, '0').slice(-LINES.length);
  const claimed = {}; LINES.forEach((l, i) => { if (bits[i] === '1') claimed[l.id] = 1; });
  const name = unhex(mm[3]).replace(/[\u0000-\u001f<>&"]/g, '').trim().slice(0, DUEL_NAME_MAX) || 'Друг';
  return { stage: 3, boss: false, duel: true, units, bonus: bonusFrom(claimed), name };
}

function shopCard(a, b, full) {
  const pure = a === b, open = pure || S.seen[speciesKey(a, b)];

  return `<div class="mc shop${open ? '' : ' lock'}" style="cursor:default">
    ${art(a, b)}
    <div class="nm">${open ? speciesName(a, b) : '???'}</div>
    <div class="meta">${geneChip(a)}${pure ? '' : ' ' + geneChip(b)}</div>
    ${open
      ? `<button class="btn buy" data-act="buy" data-id="${a}-${b}" ${can ? '' : 'disabled'}><span class="price">${price}</span></button>`
      : `<div class="meta" style="margin-top:8px;min-height:36px">выведи скрещиванием</div>`}
  </div>`;
}

function shopHTML(full) {

function viewBingo() {
  const t = bingoTier, T = TIERS[t], seen = seenOf(t), claimed = claimedOf(t);
  const total = GENE_IDS.length * GENE_IDS.length;
  const found = LINES[LINES.length - 1].cells.filter(k => seen[k]).length;
  const doneKeys = new Set();
  LINES.filter(l => l.kind !== 'all' && claimed[l.id]).forEach(l => l.cells.forEach(k => doneKeys.add(k)));
  const head = GENE_IDS.map(g => `<div class="bh" title="${GENES[g].name}">${geneIcon(g, 18)}</div>`).join('');
  const rows = GENE_IDS.map(a => `<div class="bh" title="${GENES[a].name}">${geneIcon(a, 18)}</div>` +
    GENE_IDS.map(b => {
      const k = speciesKey(a, b), ok = seen[k];
      return `<div class="bc${ok ? '' : ' lock'}${doneKeys.has(k) ? ' won' : ''}">${art(a, b)}<div class="nm">${ok ? speciesName(a, b) : '???'}</div></div>`;
    }).join('')).join('');
  const lines = LINES.map(l => {
    const p = lineProgress(l, seen), got = claimed[l.id];
    return { l, p, got };
  });
  const prize = l => t ? `Награда: ${tierStar(t, 13)} токен «${T.name.toLowerCase()}»` : `${l.desc}. Сразу: +${l.coins} монет.`;
  const list = lines.map(({ l, p, got }) => `<div class="rw${got ? ' done' : ''}">
      <div class="rw-top"><b>${l.title}</b><span class="meta">${got ? 'получено' : p.have + '/' + p.total}</span></div>
      <div class="sub" style="margin:0">${prize(l)} <span class="meta">${l.label}</span></div>
      <div class="xp" style="margin:2px 0 0"><i style="width:${Math.round(p.have / p.total * 100)}%"></i></div>
    </div>`).join('');
  const open = lines.filter(x => !x.got && x.l.kind !== 'all').sort((a, b) => (b.p.have / b.p.total) - (a.p.have / a.p.total))[0];
  let next = '';
  if (open) {
    const miss = open.l.cells.filter(k => !seen[k]).map(k => { const [a, b] = k.split('-'); return speciesName(a, b); });
    next = `<p class="sub" style="margin:10px 0 0">Ближе всего: «${open.l.title}». Не хватает: ${miss.join(', ')}.</p>`;
  }
  const seg = `<div class="seg5">${[0, 1, 2, 3, 4].map(k => `<button class="${bingoTier === k ? 'on' : ''}" data-act="bingo-tier" data-id="${k}" aria-label="${TIERS[k].name}">${k ? tierStar(k, 20) : 'Обычное'}</button>`).join('')}</div>`;
  const intro = t
    ? `${T.name} бинго: собери мутантов этого тира. Строка это первый ген, столбец это второй. За каждую линию получишь токен «${T.name.toLowerCase()}» (сейчас у тебя ×${S.tokens[t] || 0}). Клетку закрашивает только мутант именно ${T.name.toLowerCase()} тира.`
    : `Строка это первый ген, столбец это второй. Каждый новый вид закрашивает клетку. Собрал линию: получи монеты и постоянный бонус.`;
  return `
  <section class="panel">
    ${seg}
    <h2 class="h">${t ? T.name + ' бинго' : 'Бинго видов'} · ${found}/${total}</h2>
    <p class="sub">${intro}</p>
    <div class="bingo"${t ? ` style="--bwc:${T.color}"` : ''}><div></div>${head}${rows}</div>
    ${next}
  </section>
  <section class="panel">
    <h2 class="h">Награды · ${Object.keys(claimed).length}/${LINES.length}</h2>
    <div class="rwlist">${list}</div>
  </section>`;
}

function dailyHTML() {
  ensureDaily();
  const qs = S.daily.quests;
  const ready = qs.filter(q => q.p >= q.n && !q.c);
  const left = new Date(new Date().setHours(24, 0, 0, 0)) - Date.now();
  const h = Math.floor(left / 3600000), mn = Math.floor(left % 3600000 / 60000);
  const rows = qs.map(q => {
    const done = q.p >= q.n;
    const meta = q.id === 'login' ? `День ${q.d || 1} серии · бесплатно` : `${Math.min(q.p, q.n)} / ${q.n}`;
    const right = q.c ? '<span class="dq-got">Получено</span>'

    return `<li><div class="dq-main"><b>${DQ_NAME[q.id]}</b><div class="meta">${meta}${q.id === 'login' || q.c ? '' : ' · награда ' + q.r}</div>
      ${q.id === 'login' ? '' : `<div class="xp"><i style="width:${Math.round(Math.min(q.p, q.n) / q.n * 100)}%"></i></div>`}</div>${right}</li>`;
  }).join('');
  const lq = qs.find(q => q.id === 'login');
  const idx = (S.streak.n - 1) % 7, kk = dqK();
  const strip = STREAK_BASE.map((b, i) => {
    const got = i < idx || (i === idx && lq && lq.c);
    return `<div class="sd${got ? ' got' : ''}${i === idx ? ' now' : ''}"><small>${i + 1}</small><b>${Math.round(b * kk)}</b></div>`;
  }).join('');
  return `<h3>Ежедневные задания</h3>
    <p class="sub center">Серия входов: <b style="color:var(--fg)">${S.streak.n}</b> · новые задания через ${h} ч ${mn} мин.</p>

    <div class="row" style="margin-top:12px">
      ${ready.length > 1 ? `<button class="btn primary grow" data-act="dq-claim-all">Забрать всё · ${ready.reduce((a, q) => a + q.r, 0)}</button>` : ''}
      <button class="btn grow" data-act="close">Закрыть</button>
    </div>`;
}

/* ---------- ВЫБОР КОМАНДЫ ПЕРЕД БОЕМ ---------- */
let tpick = [], tpTrain = false, tpDuelSend = false, tpFoe = null;   // tpDuelSend: выбор команды для вызова другу; tpFoe: команда друга, против которой идёт бой
const tpSpec = () => tpFoe || S.foe;
const effOf = (a, b) => BEATS[a.g[0]] === b.g[0] ? 1.25 : (BEATS[b.g[0]] === a.g[0] ? 0.8 : 1);
const powerOf = m => { const st = calcStats(m, 1, bonus()); return st.hp * st.atk; };
function tpHint(m) {
  let up = 0, dn = 0;
  tpSpec().units.forEach(f => { if (effOf(m, f) > 1) up++; if (effOf(f, m) > 1) dn++; });
  return { up, dn };
}
function tpScore(m) {                                  // сила с поправкой на слабости и преимущества против текущих врагов
  const fs = tpSpec().units, n = fs.length || 1;
  const off = fs.reduce((a, f) => a + effOf(m, f), 0) / n;
  const def = fs.reduce((a, f) => a + 1 / effOf(f, m), 0) / n;
  return powerOf(m) * off * def;
}
const tpTop = fn => active().slice().sort((a, b) => fn(b) - fn(a)).slice(0, 3).map(m => m.id);

function tpSlotsHTML() {
  return [0, 1, 2].map(i => {
    const m = tpick[i] !== undefined ? byId(tpick[i]) : null;
    return m ? `<div class="tp-cell slot" data-act="tp-slot" data-id="${i}" title="Убрать из команды">${art(m.g[0], m.g[1])}<div class="nm">${geneIcon(m.g[0], 13)} ${speciesName(m.g[0], m.g[1])}</div><div class="meta">${tierStar(m.tier, 11)} ур.${m.lvl}</div></div>`
             : '<div class="tp-cell empty">пусто</div>';
  }).join('');
}
function teamPickHTML() {
  const foes = tpSpec().units.map(f => `<div class="tp-cell">${art(f.g[0], f.g[1])}<div class="nm">${geneIcon(f.g[0], 13)} ${speciesName(f.g[0], f.g[1])}</div><div class="meta">ур.${f.lvl}</div></div>`).join('');
  const ms = active().slice().sort((a, b) => powerOf(b) - powerOf(a));
  const cards = ms.map(m => {
    const st = calcStats(m, 1, bonus()), h = (tpTrain || tpDuelSend) ? { up: 0, dn: 0 } : tpHint(m);
    return `<div class="mc${tpick.includes(m.id) ? ' sel' : ''}" data-act="tp-toggle" data-id="${m.id}" tabindex="0" role="button">
      <span class="badge tpn">${tpick.indexOf(m.id) + 1}</span>
      ${art(m.g[0], m.g[1])}
      <div class="nm">${geneIcon(m.g[0], 13)} ${speciesName(m.g[0], m.g[1])}</div>
      <div class="meta">${tierStar(m.tier, 11)} ур.${m.lvl}</div>
      <div class="tp-st">${st.hp} / ${Math.round(st.atk)}</div>
      <div class="tp-adv"><span class="tp-up">${h.up ? '▲' + h.up : ''}</span> <span class="tp-dn">${h.dn ? '▼' + h.dn : ''}</span></div>
    </div>`;
  }).join('');
  return `<h3 style="margin-top:0">Выбор команды</h3>
    ${tpTrain ? `<p class="tp-h" style="margin-top:0">Полигон: враги на 1–2 уровня слабее твоей команды, случайные.</p>` : tpDuelSend ? `<p class="tp-h" style="margin-top:0">Дуэль: выбери команду, которую друг увидит в вызове. Против неё он будет сражаться.</p>` : `<p class="tp-h" style="margin-top:0">${tpFoe ? 'Против команды друга ' + esc(tpFoe.name) : `Против кого бой (стадия ${S.stage}${S.foe.boss ? ', босс' : ''})`}:</p>
    <div class="tp-row">${foes}</div>`}
    <p class="tp-h" style="margin-top:0">Твоя команда (нажми, чтобы убрать):</p>
    <div class="tp-row" id="tpSlots">${tpSlotsHTML()}</div>
    <div class="row">
      ${tpTrain || tpDuelSend ? '' : '<button class="btn primary grow" data-act="tp-counter">Подобрать против врагов</button>'}
      <button class="btn" data-act="tp-power">Сильнейшие</button>
    </div>
    <p class="tp-h">Нажми на мутанта, чтобы добавить его в команду. Под именем: здоровье / атака. <span class="tp-up">▲</span> сколько врагов он бьёт сильнее, <span class="tp-dn">▼</span> сколько врагов бьют его сильнее.</p>
    <div class="gridm tp-grid" style="margin-top:8px">${cards}</div>
    <div class="tp-bar"><button class="btn" data-act="tp-apply" id="tpApply">Готово</button>${tpDuelSend ? '' : `<button class="btn primary" data-act="tp-fight" id="tpFight">${tpTrain ? 'Тренировка' : 'В бой'}</button>`}</div>`;
}
function tpUpdate() {                                   // обновляем окно на месте, без сброса прокрутки

/* ---------- БОЙ ---------- */
function unitHTML(u) {
  return `<div class="unit" id="u-${u.id}" data-act="target" data-id="${u.id}">
    ${u.tag ? `<span class="badge boss">${u.tag}</span>` : ''}
    ${art(u.g[0], u.g[1])}
    <div class="bar"><i></i></div>
    <div class="stat-row"><span class="hpn"></span><span class="st"></span></div>
    <div class="nm">${tierStar(u.tier, 13)}${geneIcon(u.g[0], 13)} ${u.name}</div>
  </div>`;
}

function startBattle(train = false, duel = null) {
  const team = S.team.map(byId).filter(Boolean);
  if (!team.length) return;
  const B = newBattle(team, duel || (train ? genTrainSpec(team) : S.foe), bonus(), duel ? duel.bonus : null);
  Bt = { B, cur: null, mode: 'attack', auto: false, busy: false, over: false, timer: null, stage: S.stage, train, duel: !!duel, duelName: duel ? duel.name : '' };
  const me = Bt;
  $('#view').innerHTML = `<div class="battle">
    ${chartBtn()}
    <div class="mid"><div class="rd" id="rd"></div><div class="lg" id="lg"></div></div>
    <div class="field">
      <div class="col left" id="allies">${B.allies.map(unitHTML).join('')}</div>
      <div class="col right" id="foes">${B.foes.map(unitHTML).join('')}</div>
    </div>
    <div class="dock"><div class="hint" id="hint"></div><div class="ctrl" id="ctrl"></div></div>
  </div>`;
  document.body.classList.add('in-battle');
  sfx('draw', { vol: .8 });
  window.scrollTo(0, 0);
  updateBattle();
  me.timer = setTimeout(() => { if (Bt === me) battleLoop(); }, 500);
}

function updateBattle() {
  if (!Bt) return;
  const { B, cur } = Bt;
  const all = [...B.allies, ...B.foes];
  const playerTurn = cur && cur.side === 'a' && !Bt.auto && !Bt.busy && !Bt.over;
  const needT = playerTurn && (Bt.mode === 'attack' || GENES[cur.g[0]].needsTarget);
  all.forEach(u => {
    const el = $('#u-' + u.id); if (!el) return;
    const vh = u.vhp !== undefined ? u.vhp : u.hp, va = u.valive !== undefined ? u.valive : u.alive;
    const p = vh / u.max;
    const bar = el.querySelector('.bar i');
    bar.style.width = (p * 100) + '%';
    bar.className = p < 0.25 ? 'low' : p < 0.55 ? 'mid' : '';
    el.querySelector('.hpn').textContent = vh + '/' + u.max;
    el.querySelector('.st').innerHTML = va
      ? (u.poison > 0 ? `<span class="pz">яд ${u.poison}</span>` : '') + (u.side === 'a' ? (u.cd > 0 ? ` ⟳${u.cd}` : ' ✦') : '')
      : '';
    el.classList.toggle('dead', !va);
    el.classList.toggle('cur', !!cur && cur.id === u.id && !Bt.over);
    el.classList.toggle('tgt', !!needT && u.side === 'f' && va);
  });
  $('#rd').textContent = (Bt.duel ? 'Дуэль' : Bt.train ? 'Полигон' : 'Стадия ' + Bt.stage) + ' · Раунд ' + Math.max(1, B.round);
  const ctrl = $('#ctrl'), hint = $('#hint');
  const dock = document.querySelector('.dock'); if (dock) dock.classList.toggle('off', !!Bt.over);
  if (Bt.over) { ctrl.innerHTML = ''; hint.textContent = ''; return; }
  const g = cur ? GENES[cur.g[0]] : null;
  if (playerTurn) {
    hint.textContent = `Ходит ${cur.name}. ` + (Bt.mode === 'special' && g.needsTarget ? 'Выбери цель для приёма.' : 'Нажми на врага, чтобы ударить.');
  } else {
    hint.textContent = Bt.auto ? 'Автобой' : (cur ? `Ходит ${cur.name}` : '');
  }
  const spReady = playerTurn && cur.cd === 0;
  ctrl.innerHTML = `
    <button class="btn ${Bt.mode === 'attack' ? 'on' : ''}" data-act="mode-attack" ${playerTurn ? '' : 'disabled'}>Удар<small>по цели</small></button>
    <button class="btn ${Bt.mode === 'special' ? 'on' : ''}" data-act="mode-special" ${spReady ? '' : 'disabled'}>${g && cur.side === 'a' ? g.sp : 'Спецприём'}<small>${cur && cur.side === 'a' ? (cur.cd > 0 ? 'ещё ' + cur.cd + ' хода' : 'готов') : '—'}</small></button>
    <button class="btn ${Bt.auto ? 'on' : ''}" data-act="auto">Автобой</button>
    <button class="btn" data-act="retreat">Отступить</button>`;
}

function pop(id, text, cls) {
  const el = $('#u-' + id); if (!el) return;
  const s = document.createElement('span');
  s.className = 'pop ' + cls; s.textContent = text;
  el.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}
function playEvents(ev) {
  ev.forEach(e => {
    const el = $('#u-' + e.id); if (!el) return;
    if (e.type === 'acts') {
      const c = 'lunge-' + e.id[0];
      el.classList.remove('lunge-a', 'lunge-f'); void el.offsetWidth; el.classList.add(c);
    }
    if (e.type === 'dmg' || e.type === 'poison') {
      el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
      if (e.type === 'poison') sfx('weak', { vol: .45, rate: 1.4 }); else if (e.eff === 'up') sfx('clash', { vol: .55, rate: 1.1 });
      pop(e.id, '-' + e.val, e.type === 'poison' ? 'pz' : e.eff === 'up' ? 'up' : e.eff === 'down' ? 'down' : 'dm');
    }
    if (e.type === 'heal') pop(e.id, '+' + e.val, 'hl');

}

const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function fxLayer() {

  if (!l) { l = document.createElement('div'); l.className = 'fx'; f.appendChild(l); }
  return l;
}
function fxPos(el, L) {
  const s = el.querySelector('.art') || el, r = s.getBoundingClientRect(), b = L.getBoundingClientRect();
  return { x: r.left - b.left + r.width / 2, y: r.top - b.top + r.height / 2, bottom: r.bottom - b.top };
}
function fxMake(L, css, html) {
  const d = document.createElement('div'); d.className = 'fxe'; d.style.cssText = css;

}

    const p = fxMake(L, `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;border-radius:50%;background:${col}`);
    fxAnim(p, [{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(ang) * d}px,${Math.sin(ang) * d}px) scale(.3)`, opacity: 0 }], { duration: dur, easing: 'ease-out' });

}
function fxGlow(el, color, dur) {      // подсветка спрайта

}

}

  const { u, L, dmg } = c, A = $('#u-' + u.id), T = $('#u-' + dmg[0].id), t = fxPos(T, L);

  (A.querySelector('.art') || A).animate([{ transform: 'none' }, { transform: 'translateY(5px) scale(1.06,.9)', offset: .5 }, { transform: 'none' }], { duration: tele + 60 });
  const crack = fxMake(L, `left:${t.x - 48}px;top:${feetY - 9}px;width:96px;height:18px`,
    '<svg width="96" height="18" viewBox="0 0 80 16" preserveAspectRatio="none"><path d="M2 8L14 5 22 10 32 4 40 9 49 3 58 10 68 5 78 8" fill="none" stroke="#1b130c" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></svg>');
  fxAnim(crack, [{ transform: 'scaleX(0)', opacity: 1 }, { transform: 'scaleX(1)', opacity: 1, offset: .35 }, { transform: 'scaleX(1)', opacity: 1, offset: .8 }, { transform: 'scaleX(1)', opacity: 0 }], { duration: tele + rise + stay + 120 });
  c.at(tele, () => {
    [[-21, 54], [0, 80], [21, 54]].forEach(([dx, h], i) => {
      const w = 32;
      const sp = fxMake(L, `left:${t.x + dx - w / 2}px;top:${feetY - h}px;width:${w}px;height:${h}px;transform-origin:50% 100%`,
        `<svg width="${w}" height="${h}" viewBox="0 0 30 60" preserveAspectRatio="none" style="display:block"><path d="M3 60C6 40 10 18 15 2C20 18 24 40 27 60Z" fill="#e6dcc2" stroke="#0d1b24" stroke-width="3" vector-effect="non-scaling-stroke"/><path d="M11 56C12 40 13 24 15 10" stroke="#fff" stroke-opacity=".65" stroke-width="2.5" fill="none" vector-effect="non-scaling-stroke"/><path d="M8 40H22M9 28H21" stroke="#b9ad8f" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`);
      sp.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1.12)', offset: .7 }, { transform: 'scaleY(1)' }], { duration: rise, fill: 'both', easing: 'ease-out' });
      c.at(rise + stay, () => fxAnim(sp, [{ transform: 'scaleY(1)', opacity: 1 }, { transform: 'scaleY(.1)', opacity: 0 }], { duration: 200 }));
    });
    fxSparks(L, t.x, feetY, 8, '#8a6a45', 30, 5, 420);
  });
  c.at(tele + rise - 20, () => (T.querySelector('.art') || T).animate([{ transform: 'none' }, { transform: 'translateY(-9px)', offset: .35 }, { transform: 'none' }], { duration: 280 }));
  return { times: [tele + rise - 20], healAt: tele + rise + 100, total: tele + rise + stay + 200 };
};

/* ---------- ЗВУК В БОЮ ---------- */
function sfx(n, o) { try { if (window.Snd) Snd.play(n, o); } catch (e) {} }
function sfxAt(me, ms, n, o) { if (!ms) return sfx(n, o); setTimeout(() => { if (Bt === me) sfx(n, o); }, ms); }
const SFX_PLAIN = { fang: 'flesh', steel: 'boomS', spore: 'zap', ether: 'slam', bone: 'spike' };
function sfxAction(me, u, kind, dmg, heal, plan) {
  const g = u.g[0], sp = kind === 'special', at = (ms, n, o) => sfxAt(me, Math.max(0, ms), n, o);
  if (!plan) {                                           // без анимации: по одному звуку на удар
    dmg.forEach((e, i) => at(i * 90, SFX_PLAIN[g] || 'flesh'));
    if (heal.length) at(0, 'heal', { vol: .8 });
    return;
  }
  const T = plan.times;
  if (g === 'fang') {
    T.forEach((ms, i) => { at(ms - 150, i ? 'swingL1' : (sp ? 'swingH' : 'swingL2'), { vol: .8 }); at(ms, 'flesh'); });
  } else if (g === 'steel') {
    T.forEach((ms, i) => { at(i * 110, 'shot', { vol: .7 }); at(ms, sp ? 'boomL' : 'boomS', { vol: sp ? .7 : 1 }); });
  } else if (g === 'spore') {
    at(100, 'beam', { vol: .8 });
    T.forEach(ms => at(ms, 'zap', { vol: .9 }));
    if (sp) at(520, 'weak', { vol: .5, rate: 1.25 });
  } else if (g === 'ether') {
    if (dmg.length) { at(0, 'charge', { vol: .75 }); T.forEach(ms => at(ms, 'slam')); }
    else if (heal.length) at((plan.healAt || 380) - 220, 'heal', { vol: .9 });
  } else if (g === 'bone') {
    at(40, 'plate', { vol: .45, rate: .6 });
    T.forEach(ms => at(ms, 'spike'));
    if (heal.length) at(plan.healAt || 400, 'tick', { vol: .9 });
  }
}

function land(me, e) {
  const x = [...me.B.allies, ...me.B.foes].find(q => q.id === e.id);
  if (x && x.vhp !== undefined) {
    if (e.type === 'dmg' || e.type === 'poison') { const was = x.valive; x.vhp = Math.max(0, x.vhp - e.val); x.valive = x.vhp > 0; if (was && !x.valive) sfxAt(me, 140, 'plate', { vol: .85, rate: .6 }); }
    if (e.type === 'heal') x.vhp = Math.min(x.max, x.vhp + e.val);
  }
  playEvents([e]);
  updateBattle();
}

// Запускает анимацию действия. Возвращает длительность в мс.
function playAction(me, u, kind, ev) {
  const dmg = ev.filter(e => e.type === 'dmg'), heal = ev.filter(e => e.type === 'heal');
  const L = REDUCED ? null : fxLayer(), fn = FX[u.g[0]];
  let plan = null;
  if (L && fn && (dmg.length || heal.length)) {
    const c = { me, u, kind, L, dmg, heal, at: (ms, f) => setTimeout(() => { if (Bt === me) f(); }, ms) };
    try { plan = fn(c); } catch (err) { plan = null; }
  }
  if (!plan) {                                          // без анимации: всё сразу, как раньше
    [...me.B.allies, ...me.B.foes].forEach(x => { delete x.vhp; delete x.valive; });
    sfxAction(me, u, kind, dmg, heal, null);
    playEvents(ev);
    return 0;
  }
  sfxAction(me, u, kind, dmg, heal, plan);
  let di = 0;
  const last = Math.max(0, ...plan.times);
  ev.forEach(e => {
    if (e.type === 'acts') return;
    const ms = e.type === 'dmg' ? (plan.times[di++] ?? plan.total) : (plan.healAt !== undefined ? plan.healAt : last + 40);
    setTimeout(() => { if (Bt === me) land(me, e); }, ms);
  });
  setTimeout(() => { if (Bt === me) L.querySelectorAll('.fxe').forEach(n => n.remove()); }, plan.total + 600);
  return plan.total;
}

function battleLoop() {
  const me = Bt; if (!me) return;
  [...me.B.allies, ...me.B.foes].forEach(x => { delete x.vhp; delete x.valive; });
  const r = nextActor(me.B);
  playEvents(r.ev);
  if (!r.u) { me.cur = null; updateBattle(); return finishBattle(); }
  me.cur = r.u; me.mode = 'attack'; me.busy = false;
  updateBattle();
  if (r.u.side === 'f' || me.auto) {
    me.busy = true;
    me.timer = setTimeout(() => { if (Bt === me) { const c = aiChoose(me.B, r.u); doAct(r.u, c.kind, c.target); } }, 650);
  }
}

function doAct(u, kind, target) {
  const me = Bt; if (!me) return;
  me.busy = true;
  [...me.B.allies, ...me.B.foes].forEach(x => { x.vhp = x.hp; x.valive = x.alive; });   // полоски обновятся в момент удара
  const r = act(me.B, u, kind, target);
  $('#lg').textContent = r.text;
  const dur = playAction(me, u, kind, r.ev);
  updateBattle();
  me.timer = setTimeout(() => { if (Bt === me) battleLoop(); }, Math.max(850, dur + 250));
}

function finishBattle() {
  const me = Bt; me.over = true;
  { const dk = document.querySelector('.dock'); if (dk) dk.classList.add('off'); }
  const won = outcome(me.B) === 'win';
  setTimeout(() => sfx(won ? 'win' : 'weak', won ? { vol: 1, pr: 0 } : { vol: .9, rate: .8 }), 250);
  if (me.duel) { finishDuel(me, won); return; }
  if (me.train) { finishTraining(me, won); return; }
  const rw = rewards(S.stage, won);
  rw.coins = Math.round(rw.coins * bonus().coinMult);
  S.coins += rw.coins;
  const lines = [];
  S.team.map(byId).forEach((m, i) => {
    const u = me.B.allies[i];
    const gain = Math.round(rw.xp * (u && u.alive ? 1 : 0.6));
    const ups = addXp(m, gain);
    lines.push(`<li>${speciesName(m.g[0], m.g[1])}: <b>+${gain}</b> опыта${ups.length ? ` · уровень <b>${m.lvl}</b>` : ''}</li>`);
  });
  dq('fight'); if (won) dq('win');
  if (won) {
    S.wins++; S.stage++; S.best = Math.max(S.best, S.stage);
    S.foe = genFoeSpec(S.stage);
  } else S.losses++;
  save();
  if (won) submitScore();
  openModal(`<div class="center"><span class="new">${won ? 'Победа' : 'Поражение'}</span></div>
    <h3>${won ? 'Арена пройдена' : 'Команду разбили'}</h3>
    <p class="sub center">${won ? `Открыта стадия ${S.stage}.` : 'Враги остались прежними. Прокачай команду или скрести новых мутантов и попробуй ещё раз.'}</p>
    <ul class="list"><li>Монеты: <b>+${rw.coins}</b></li>${lines.join('')}</ul>
    <button class="btn primary wide" data-act="after-battle">Продолжить</button>`);
}

function finishTraining(me, won) {
  const streakBefore = S.trainStreak || 0;
  const avg = trainAvgLvl(S.team.map(byId));
  const mult = won ? trainMult(streakBefore) : 1;
  const base = won ? Math.round(trainWinXp(avg) * mult) : trainLoseXp(avg);
  S.trainStreak = won ? streakBefore + 1 : 0;
  const lines = [];
  S.team.map(byId).forEach((m, i) => {
    if (!m) return;
    const name = speciesName(m.g[0], m.g[1]);
    const u = me.B.allies[i];
    const gain = Math.round(base * (u && u.alive ? 1 : 0.6));
    const up = addXp(m, gain).length > 0;
    lines.push(`<li>${name}: <b>+${gain}</b> опыта${up ? ` · уровень <b>${m.lvl}</b>` : ''}</li>`);
  });
  save();
  const streakLine = won
    ? `Серия побед: <b>${S.trainStreak}</b>${mult > 1 ? ` · опыт ×${fmtMult(mult)}` : ''}. Следующая победа даст ×${fmtMult(trainMult(S.trainStreak))}.`
    : (streakBefore ? `Серия из ${streakBefore} побед прервалась.` : 'Победи, чтобы начать серию.');
  openModal(`<div class="center"><span class="new">${won ? 'Тренировка пройдена' : 'Тренировка не удалась'}</span></div>
    <h3>Полигон</h3>
    <p class="sub center">${streakLine}</p>
    <ul class="list">${lines.join('')}</ul>
    <p class="sub center" style="margin:0 0 10px">Монет за тренировку нет, стадия не меняется.</p>
    <button class="btn primary wide" data-act="after-battle">Продолжить</button>`);
}

function leaveBattle() {
  if (Bt) clearTimeout(Bt.timer);
  Bt = null; closeModal(); render();
}

/* ---------- ДЕЙСТВИЯ ---------- */
function newMutant(g, gen) {
  const m = { id: S.nextId++, g, lvl: 1, xp: 0, gen };
  S.mutants.push(m);
  const k = speciesKey(g[0], g[1]);
  const fresh = !S.seen[k]; S.seen[k] = 1;
  const bingo = fresh ? checkBingo(S) : [];
  return { m, fresh, bingo };
}

function bingoHTML(lines) {
  if (!lines.length) return '';
  return `<div class="bingo-note"><span class="new">Бинго!</span>
    <ul class="list" style="margin:8px 0 0">${lines.map(l => l.tier ? `<li>${tierStar(l.tier, 14)} <b>${TIERS[l.tier].name}: ${l.title}</b>. Награда: токен «${TIERS[l.tier].name.toLowerCase()}» ×1</li>` : `<li><b>${l.title}</b>: ${l.desc}. Монеты: <b>+${l.coins}</b></li>`).join('')}</ul></div>`;
}

function showNewborn(m, fresh, mutated, bingo = []) {
