<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полоска — таскбар-РПГ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
:root{--bg:#e9e4d6;--panel:#f5f1e6;--ink:#2b2a26;--dim:#7a766a;--line:#cfc8b4;--sky:#d9d3bf;--ground:#b9b197;--hero:#b8860b;--bad:#b3392f;--xp:#3d7a5c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--panel:#181b24;--ink:#e6e2d6;--dim:#8a8778;--line:#2c3140;--sky:#141722;--ground:#2a2f3a;--hero:#e8c25a;--bad:#d4574e;--xp:#5fb48a}}
:root[data-theme="dark"]{--bg:#0f1117;--panel:#181b24;--ink:#e6e2d6;--dim:#8a8778;--line:#2c3140;--sky:#141722;--ground:#2a2f3a;--hero:#e8c25a;--bad:#d4574e;--xp:#5fb48a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;justify-content:flex-end}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:12px;box-sizing:border-box}
.hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-family:'Silkscreen',ui-monospace,monospace;font-size:13px;margin-bottom:6px}
.bar{position:relative;width:120px;height:10px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--bad)}
.bar.x i{background:var(--xp)}
.sp{flex:1}
canvas{display:block;width:100%;height:auto;aspect-ratio:1000/140;background:var(--sky);border:1px solid var(--line);border-radius:4px;image-rendering:pixelated}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}
.shop button,.tools button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px;text-align:left;cursor:pointer}
.shop button:hover:not(:disabled){border-color:var(--hero)}
.shop button:disabled{opacity:.5;cursor:not-allowed}
.shop b{display:block;font-weight:600}
.shop small{color:var(--dim)}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{padding:4px 10px;text-align:center}
:focus-visible{outline:2px solid var(--hero);outline-offset:2px}
.compact .shop{display:none}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="hud">
    <span id="lvl">Ур. 1</span>
    <span>HP <span class="bar"><i id="hpb"></i></span></span>
    <span>XP <span class="bar x"><i id="xpb"></i></span></span>
    <span id="gold">🪙 0</span>
    <span id="stage">Этап 1</span>
  </div>
  <canvas id="c" width="1000" height="140"></canvas>
  <div class="shop">
    <button id="u-atk"></button>
    <button id="u-hp"></button>
    <button id="u-spd"></button>
  </div>
  <div class="tools">
    <button id="t-compact">Свернуть до полоски</button>
    <button id="t-reset">Начать заново</button>
    <span class="sp"></span>
    <small id="msg" style="color:var(--dim);align-self:center"></small>
  </div>
</div>
<script>
(function(){
var KEY='taskbar-rpg-v1',$=function(i){return document.getElementById(i)};
var S={lvl:1,xp:0,gold:0,atk:0,hp:0,spd:0,kills:0,t:Date.now()};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function stage(){return Math.floor(S.kills/10)+1}
function dmg(){return 3+S.lvl+S.atk*2}
function maxhp(){return 30+S.lvl*5+S.hp*10}
function interval(){return Math.max(.25,1-S.spd*.08)}
function cost(n){return Math.round(10*Math.pow(1.5,n))}
var msgT=0;function say(t){$('msg').textContent=t;msgT=4}
var away=Math.min(120,(Date.now()-S.t)/60000);
if(away>=1){var g=Math.round(away*stage()*2);S.gold+=g;say('Пока вас не было: +'+g+' 🪙')}

  var o=IM[k][a];if(!o||!o.i.naturalWidth)return;

var hp=maxhp(),enemy=null,heroCd=0,world=0,floats=[],deadT=0,fighting=false,hero={atkT:0,hitT:0,alt:0};
function spawn(){
  var st=stage(),boss=(S.kills+1)%10===0,pool=['goblin','mushroom','skeleton','eye'].slice(0,Math.min(4,st+1));
  var k=pool[Math.floor(Math.random()*pool.length)],mult=boss?5:1;
  enemy={x:1080,k:k,boss:boss,s:boss?1.7:1,hp:(8+st*6)*mult,max:(8+st*6)*mult,d:(2+st*1.5)*(boss?2:1),cd:0,atkT:0,hitT:0,dying:0,xp:(4+st*2)*mult,g:(2+st)*mult};
}

function update(dt){
  clock+=dt;
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
  hero.atkT-=dt;hero.hitT-=dt;
  if(deadT>0){deadT-=dt;if(deadT<=0){hp=maxhp();enemy=null}return}
  if(!enemy)spawn();
  enemy.atkT-=dt;enemy.hitT-=dt;
  if(enemy.dying>0){fighting=false;enemy.dying-=dt;if(enemy.dying<=0)enemy=null;return}
  var thr=enemy.boss?64:42;fighting=enemy.x-HX<=thr;
  if(!fighting){enemy.x-=70*dt;world+=70*dt;return}
  heroCd-=dt;enemy.cd-=dt;
  if(heroCd<=0){heroCd=interval();var d=dmg();enemy.hp-=d;enemy.hitT=.2;hero.atkT=ATK;hero.alt^=1;float(enemy.x,GY-52,'-'+d,'#f2d36b')}
  if(enemy.cd<=0){enemy.cd=1;enemy.atkT=.6;hp-=enemy.d;hero.hitT=.25;float(HX,GY-52,'-'+Math.round(enemy.d),'#ff7a6b')}
  if(enemy.hp<=0){S.kills++;S.gold+=enemy.g;gain(enemy.xp);float(enemy.x,GY-60,'+'+enemy.g+'🪙','#f2d36b');enemy.dying=.55;heroCd=0}
  else if(hp<=0){S.kills=Math.max(0,Math.floor(S.kills/10)*10);deadT=1.5;S.gold=Math.floor(S.gold*.9);say('Герой пал. Откат к началу этапа.')}

}

  cx.fillStyle='#19281f';cx.fillRect(0,H-18,W,18);

  cx.fillStyle='#2c4538';
  for(var i=0;i<30;i++){var gx=((i*40-world)%1200+1200)%1200-100;cx.fillRect(gx,H-7,16,2)}
  // герой
  if(deadT>0)spr('hero','death',shot(['hero','death'],(1.5-deadT)/.8),HX,FEET,1,false);
  else if(hero.hitT>0)spr('hero','hit',shot(['hero','hit'],(.25-hero.hitT)/.25),HX,FEET,1,false);
  else if(hero.atkT>0){var an=hero.alt?'atk1':'atk2';spr('hero',an,shot(['hero',an],(ATK-hero.atkT)/ATK),HX,FEET,1,false)}
  else if(enemy&&(fighting||enemy.dying>0))spr('hero','idle',loop(['hero','idle'],8),HX,FEET,1,false);
  else spr('hero','run',loop(['hero','run'],12),HX,FEET,1,false);
  // враг
  if(enemy){
    var k=enemy.k,a,f,y=FEET-(k==='eye'?14:0);
    if(enemy.dying>0){a='death';f=shot([k,a],(.55-enemy.dying)/.55)}
    else if(enemy.hitT>0){a='hit';f=shot([k,a],(.2-enemy.hitT)/.2)}
    else if(enemy.atkT>0){a='atk';f=shot([k,a],(.6-enemy.atkT)/.6)}
    else if(fighting){a='idle';f=loop([k,a],6)}
    else{a='run';f=loop([k,a],10)}
    spr(k,a,f,enemy.x,y,enemy.s,true,enemy.dying>0?Math.max(.3,enemy.dying/.55):1);
    if(!(enemy.dying>0)){var bw=enemy.boss?70:40,by=FEET-(enemy.boss?92:56);
      cx.fillStyle='#0e1512';cx.fillRect(enemy.x-bw/2,by,bw,4);

  }
  cx.textAlign='center';cx.font='bold 14px Silkscreen,monospace';
  floats.forEach(function(f){cx.globalAlpha=Math.min(1,f.l*2);cx.fillStyle=f.c;cx.fillText(f.t,f.x,f.y)});
  cx.globalAlpha=1;
}
function ui(){
  $('lvl').textContent='Ур. '+S.lvl;
  $('hpb').style.width=Math.max(0,hp/maxhp()*100)+'%';
  $('xpb').style.width=(S.xp/(S.lvl*15)*100)+'%';
  $('gold').textContent='🪙 '+Math.floor(S.gold);
  $('stage').textContent='Этап '+stage();
  var u=[['atk','⚔️ Меч','Урон '+dmg()+' → '+(dmg()+2)],['hp','🛡️ Броня','HP '+maxhp()+' → '+(maxhp()+10)],['spd','⚡ Скорость','Удар раз в '+interval().toFixed(2)+' с → '+Math.max(.25,interval()-.08).toFixed(2)+' с']];
  u.forEach(function(r){var b=$('u-'+r[0]),c=cost(S[r[0]]);var maxed=r[0]==='spd'&&interval()<=.25;
    b.innerHTML='<b>'+r[1]+' · '+(maxed?'максимум':c+' 🪙')+'</b><small>'+(maxed?'Быстрее нельзя':r[2])+'</small>';
    b.disabled=maxed||S.gold<c});
}
function buy(k){var c=cost(S[k]);if(S.gold<c)return;S.gold-=c;S[k]++;if(k==='hp')hp+=10;save();ui()}
$('u-atk').onclick=function(){buy('atk')};
$('u-hp').onclick=function(){buy('hp')};
$('u-spd').onclick=function(){buy('spd')};
$('t-compact').onclick=function(){var a=$('app');a.classList.toggle('compact');$('t-compact').textContent=a.classList.contains('compact')?'Показать улучшения':'Свернуть до полоски'};
$('t-reset').onclick=function(){if(confirm('Стереть прогресс и начать заново?')){try{localStorage.removeItem(KEY)}catch(e){}S={lvl:1,xp:0,gold:0,atk:0,hp:0,spd:0,kills:0,t:Date.now()};hp=maxhp();enemy=null;ui()}};

var last=performance.now(),acc=0;
function frame(n){var dt=Math.min(.1,(n-last)/1000);last=n;update(dt);draw();acc+=dt;if(acc>.25){acc=0;ui()}requestAnimationFrame(frame)}
setInterval(save,5000);
setInterval(function(){if(document.hidden){var n=performance.now(),dt=Math.min(1,(n-last)/1000);last=n;update(dt);ui()}},500);
ui();requestAnimationFrame(frame);
})();

</script>
</body>
