/* Layout: одноколонный мобильный игровой экран. Липкая шапка с монетами и стадией, нижняя навигация, бой на всю ширину. */
:root{
  --bg:#0f1720; --surface:#17222e; --surface2:#1f2e3d; --line:#2c4054;
  --fg:#e8eef4; --muted:#8fa3b5; --coin:#ffc857; --ink:#0a1017;
  --fang:#ff6b57; --steel:#5aa9e6; --spore:#9bd04f; --ether:#b78cff;
  --good:#5fd38d; --bad:#ff5d6c;
  --font-display:'Kechusilka',system-ui,sans-serif;
  --font-body:'Kechusilka',system-ui,sans-serif;
  --font-mono:'Kechusilka',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-synthesis:none}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:23px;line-height:1.45;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.logo{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.logo small{display:block;font-family:var(--font-mono);font-weight:500;font-size:16px;letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-family:var(--font-mono);font-weight:700;font-size:20.5px;font-variant-numeric:tabular-nums}
.dq-btn{position:relative;width:34px;height:34px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0;color:var(--fg)}
.dq-btn:hover{border-color:var(--muted)}
.dq-dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);box-sizing:content-box}
.in-battle .dq-btn{display:none}
.tp-row{display:flex;gap:8px;margin:6px 0 10px}
.sheet .tp-cell{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:17px;line-height:1.25}
.sheet .tp-cell .art{max-width:52px;margin:0 auto}
.tp-cell.slot{cursor:pointer;min-height:84px}
.tp-cell.empty{border-style:dashed;color:var(--muted);display:grid;place-items:center;cursor:default}
.tp-cell .nm{font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-h{font-size:19px;color:var(--muted);margin:10px 0 0}
.tp-adv{font-family:var(--font-mono);font-size:17px;font-weight:700;margin-top:2px}
.tp-up{color:var(--good)}.tp-dn{color:var(--bad)}
.tp-st{font-family:var(--font-mono);font-size:16px;color:var(--muted);margin-top:2px}
.mc .tpn{display:none}.mc.sel .tpn{display:block}
.sheet .tp-grid .art{max-width:74px}
.tp-grid .mc{padding:6px 4px 6px}
.tp-grid .nm{font-size:19px}
.tp-bar{position:sticky;bottom:-16px;margin:12px -16px -16px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;z-index:3}
.tp-bar .btn{flex:1}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:6px}
.sd{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 0;text-align:center;line-height:1.2}
.sd small{display:block;font-size:16px;color:var(--muted)}
.sd b{font-family:var(--font-mono);font-size:19px}
.sd.got{opacity:.5}
.sd.got b::after{content:" ✓";color:var(--good)}
.sd.now{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin);opacity:1}
.dqs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.dqs li{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dqs .dq-main{flex:1;min-width:0}
.dqs .dq-main b{font-size:22.5px}
.dqs .xp{margin:6px 0 0}
.dq-got{color:var(--good);font-size:19px;font-weight:700;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--coin)}
.chip.stage i{background:var(--fang);border-radius:2px;transform:rotate(45deg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.h{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);font-size:20.5px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

.btn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:600;font-size:22.5px;min-height:44px;transition:transform .08s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--coin);color:var(--ink);border-color:var(--coin);font-family:var(--font-display);font-weight:700;font-size:20.5px;letter-spacing:.05em;text-transform:uppercase}
.btn.on{border-color:var(--coin);color:var(--coin)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.price{font-family:var(--font-mono);font-weight:700}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gridm{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}

.mc{position:relative;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 6px 8px;text-align:center;cursor:pointer}
.mc.empty{display:grid;place-items:center;min-height:130px;color:var(--muted);font-size:19px;border-style:dashed;cursor:default}
.mc.sel{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.art{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;background:radial-gradient(closest-side at 50% 62%,color-mix(in srgb,var(--c1) 38%,transparent),transparent 100%),var(--ink);overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.nm{font-weight:600;font-size:20.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-family:var(--font-mono);font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{position:absolute;top:4px;left:4px;z-index:2;font-family:var(--font-mono);font-size:16px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.badge.boss{background:var(--bad);color:var(--ink);border-color:var(--bad)}

.gene{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:17px;font-weight:700}
.gene::before{display:none}
.gi{display:inline-block;vertical-align:-3px;flex:none}
.cycle{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:19px;color:var(--muted)}
.cycle b{font-family:var(--font-mono);font-weight:500}

/* бой */
.battle{margin-top:14px}
.field{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:6px 0}
.field::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--line)}
.field::after{content:"VS";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);padding:6px 4px;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.08em;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col.left{align-items:flex-start}
.col.right{align-items:flex-end}
.col .unit{width:min(100%,118px)}
.col.left .unit:nth-child(2){margin-left:min(14%,26px)}
.col.right .unit:nth-child(2){margin-right:min(14%,26px)}
.unit{position:relative;min-width:0;padding:14px 0 0;text-align:center;transition:opacity .3s}
.unit .art{background:none;overflow:visible;border-radius:0}
.unit .bar{width:78%;height:7px;margin:0 auto}
.unit .nm{margin-top:4px;font-size:19px}
.unit .stat-row{justify-content:center;gap:8px}
.unit::before{content:"";position:absolute;left:50%;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid transparent;transform:translateX(-50%);transition:border-top-color .15s}
.unit .art svg{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.unit:nth-child(2) .art svg{animation-delay:-.9s}
.unit:nth-child(3) .art svg{animation-delay:-1.7s}
.unit.dead{opacity:.28;filter:grayscale(1)}
.unit.dead .art svg{animation:none}
.unit.cur::before{border-top-color:var(--coin)}
.unit.cur .art svg{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--coin) 70%,transparent))}
.unit.tgt{cursor:pointer}
.unit.tgt::before{border-top-color:var(--bad)}
.unit.tgt .art svg{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--bad) 75%,transparent))}
.unit.hit .art{animation:shake .3s}
.unit.lunge-a{animation:lungea .4s}
.unit.lunge-f{animation:lungef .4s}
.bar{height:6px;background:var(--ink);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:100%;background:var(--good);transition:width .4s,background .4s}
.bar i.mid{background:var(--coin)}.bar i.low{background:var(--bad)}
.stat-row{display:flex;justify-content:space-between;gap:4px;margin-top:3px;font-family:var(--font-mono);font-size:16px;color:var(--muted);min-height:15px}
.stat-row .pz{color:var(--spore)}
.pop{position:absolute;left:50%;top:26%;z-index:3;font-family:var(--font-mono);font-weight:700;font-size:29.5px;pointer-events:none;text-shadow:0 1px 0 #000,0 0 6px #000;animation:rise .95s ease-out forwards}
.pop.dm{color:#fff}.pop.up{color:var(--coin)}.pop.down{color:var(--muted)}.pop.hl{color:var(--good)}.pop.pz{color:var(--spore)}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;text-align:center}
.mid .rd{font-family:var(--font-display);font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mid .lg{font-size:22.5px;min-height:21px;font-weight:500}
.hint{font-size:20.5px;color:var(--muted);text-align:center;margin:12px 0 8px;min-height:20px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl .btn small{display:block;font-family:var(--font-mono);font-weight:500;font-size:17px;color:var(--muted)}
body.in-battle .tabs{display:none}
[hidden]{display:none!important}

/* нижняя навигация */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:560px;margin:0 auto;display:flex;gap:4px}
.tab{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:10px;padding:10px 2px;font-family:var(--font-display);font-weight:500;font-size:15px;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;color:var(--muted)}
.tab.on{background:var(--surface2);border-color:var(--line);color:var(--fg)}

/* окна */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,9,13,.8);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:440px;max-height:88dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;animation:up .22s ease-out}
.sheet .art{max-width:190px;margin:0 auto}
.sheet h3{font-family:var(--font-display);font-weight:700;font-size:25px;margin:12px 0 6px;text-align:center;text-wrap:balance}
.center{text-align:center}
.atabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.atabs button{display:grid;justify-items:center;gap:4px;padding:9px 2px 8px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.02em;min-width:0}
.atabs button svg{width:22px;height:22px}
.atabs button.on{background:var(--surface2);border-color:var(--coin);color:var(--coin);box-shadow:inset 0 -2px 0 var(--coin)}
.streak{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.streak-top{display:grid;gap:2px}
.streak-top b{font-family:var(--font-display);font-size:22.5px}
.streak-top span{font-size:19px;color:var(--coin);font-family:var(--font-mono)}
.pips{display:flex;gap:4px;margin-top:8px}
.pips i{flex:1;height:8px;border-radius:4px;background:var(--ink)}
.pips i.on{background:var(--coin)}
.tstats,.rstats{display:grid;gap:8px;margin:4px 0 12px}
.tstats{grid-template-columns:repeat(3,1fr)}
.rstats{grid-template-columns:1fr 1fr}
.tstats div,.rstats div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.tstats b,.rstats b{display:block;font-family:var(--font-mono);font-size:29.5px;font-variant-numeric:tabular-nums}
.rstats b.coinv{color:var(--coin)}
.tstats span,.rstats span{display:block;font-size:17px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--surface2);border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--font-mono);font-size:26.5px;font-variant-numeric:tabular-nums}
.stats span{font-size:17px;color:var(--muted)}
.xp{height:6px;background:var(--ink);border-radius:3px;overflow:hidden;margin:4px 0 12px}
.xp i{display:block;height:100%;background:var(--steel)}
.new{display:inline-block;background:var(--coin);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:5px}
.list{margin:8px 0 14px;padding:0;list-style:none;display:grid;gap:4px;font-size:22.5px}
.list b{font-family:var(--font-mono)}

/* лаборатория */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:12px}
.pair .x{font-family:var(--font-mono);color:var(--muted);text-align:center;font-size:28px}
.codex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cx{display:flex;align-items:center;gap:8px;min-width:0;background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:20.5px}
.cx .gp{display:flex;gap:3px;flex:none}
.cx .gp i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.cx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx.lock{color:var(--muted)}

/* бинго */
.bingo{display:grid;grid-template-columns:20px repeat(5,minmax(0,1fr));gap:4px;align-items:stretch}
.bh{display:grid;place-items:center;min-height:20px}
.bh .gi{vertical-align:middle}
.bc{min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 3px 4px;text-align:center}
.bc .art{border-radius:6px}
.bc .nm{font-size:14.5px;margin-top:3px;line-height:1.2}
.bc.lock .art svg{filter:brightness(0) opacity(.3)}
.bc.lock .nm{color:var(--muted);font-weight:500}
.bc.won{border-color:var(--bwc,var(--coin));box-shadow:inset 0 0 0 1px var(--bwc,var(--coin))}
.seg5{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg5 button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:19px;display:grid;place-items:center;padding:0 2px}
.seg5 button.on{border-color:var(--coin);color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.rwlist{display:grid;gap:8px}
.rw{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.rw.done{border-color:var(--coin)}
.rw-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rw-top b{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.02em}
.rw.done .rw-top .meta{color:var(--coin)}
.bingo-note{margin:12px 0;background:var(--surface2);border:1px solid var(--coin);border-radius:10px;padding:12px}
.shop .btn.buy{margin-top:8px;width:100%;min-height:38px;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:6px}
.shop .btn.buy::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--coin)}
.shop.lock .art svg{filter:brightness(0) opacity(.35)}
.shop .meta{display:flex;flex-wrap:wrap;gap:2px 8px;justify-content:center;margin-top:2px}

.tab{font-size:13px;letter-spacing:.02em;padding:10px 1px}
@media (max-width:359px){.tab{font-size:11.5px;letter-spacing:0}}
/* рейтинг */
.lb{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.lb li{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.lb .pos{flex:none;width:28px;font-family:var(--font-mono);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lb li:nth-child(1) .pos{color:var(--coin)}
.lb li:nth-child(2) .pos{color:#c9d3dc}
.lb li:nth-child(3) .pos{color:#d98e55}
.lb .who{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .sc{flex:none;font-family:var(--font-mono);font-weight:700;font-size:20.5px;color:var(--coin);font-variant-numeric:tabular-nums}
/* звёздные тиры */
.t1{--tc:#cd7f32}.t2{--tc:#c9d3dc}.t3{--tc:#ffd24d}.t4{--tc:#8fe8ff}
.mc.tiered{border-color:var(--tc)}
.mc.tiered .art{box-shadow:inset 0 0 0 2px var(--tc)}
.mc.t4 .art{box-shadow:inset 0 0 0 2px var(--tc),0 0 12px color-mix(in srgb,var(--tc) 60%,transparent)}
.tstar{position:absolute;top:5px;right:5px;z-index:2;line-height:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.mc.dim{opacity:.45}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:22.5px}
.seg button.on{border-color:var(--coin);color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.tk{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.tk .info{flex:1;min-width:0}
.tk .info b{display:block;font-size:22.5px}
.tk .info span{font-size:19px;color:var(--muted)}
.tk .own{font-family:var(--font-mono);font-weight:700;min-width:28px;text-align:right}
.tk .btn.buy{min-height:40px;padding:6px 12px}
.starwrap{display:grid;justify-items:center;gap:3px}
.starwrap span{font-size:14.5px;line-height:1;color:var(--coin);font-weight:700}
.starbtn{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1.5px dashed var(--coin);display:grid;place-items:center;padding:0;color:var(--coin);justify-self:center}
.starbtn.on{border:1.5px solid var(--tc);box-shadow:0 0 0 1px var(--tc);color:var(--fg)}
.tk.tap{cursor:pointer}
.tk.on{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.stars-sel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 10px}
.stars-sel .btn{display:grid;gap:2px;justify-items:center;padding:8px 4px;min-height:54px}
.stars-sel small{font-size:17px;color:var(--muted)}
.stars-sel .btn.on{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin)}
.stars-sel .btn.on small:last-child{color:var(--fg);font-weight:700}
/* кнопка «кто кого бьёт» и окно с кругом */
.chartbtn{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;padding:0;color:var(--muted)}
.chartbtn:hover{border-color:var(--muted)}
.panel.has-chart{position:relative}
.panel.has-chart>.chartbtn{position:absolute;top:10px;right:10px}
.battle{position:relative}
.battle>.chartbtn{position:absolute;top:2px;right:0;z-index:6}
.battle .mid{padding-left:36px;padding-right:36px}
/* экран боя: всё на одном экране, кнопки закреплены внизу */
.battle{margin-top:6px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.battle .mid{padding:2px 0;gap:2px}
.battle .mid .lg{min-height:18px;font-size:20.5px}
.battle .field{gap:10px;padding:2px 0}
.battle .col{gap:4px}
.battle .unit{padding-top:8px}
body.in-battle .top{display:none}
.battle .unit .art{width:clamp(44px,calc(33.3vh - 146px),110px);width:clamp(44px,calc(33.3dvh - 146px),110px);margin:0 auto}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.dock>*{max-width:560px;margin-left:auto;margin-right:auto}
.dock .hint{margin:0 0 6px;min-height:18px;font-size:19px}
.dock .ctrl{gap:6px}
.dock .ctrl .btn[data-act="auto"],.dock .ctrl .btn[data-act="retreat"]{padding:6px;font-size:19px;min-height:34px}
.dock.off{display:none}
/* ползунок прокрутки: показывает, что страницу можно листать */
.sb{position:fixed;right:3px;width:5px;z-index:8;border-radius:3px;background:rgba(255,255,255,.08);pointer-events:none}
.sb i{display:block;width:100%;border-radius:3px;background:var(--coin);opacity:.85;box-shadow:0 0 6px rgba(255,200,87,.35)}
.sb-sheet{z-index:25;width:4px;right:auto}
/* слой эффектов атак */
.fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.fxe{position:absolute;pointer-events:none;will-change:transform,opacity}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,.98)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-38px)}}
@keyframes lungea{40%{transform:translateX(18px)}}
@keyframes lungef{40%{transform:translateX(-18px)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:520px){.overlay{align-items:center}}

.top .chips{flex-wrap:nowrap;gap:6px}.top .logo{min-width:0}

/* ===== Sprout Lands theme (UI Pack by Cup Nooble) ===== */
:root{
  --bg:#86b254; --surface:#efd7a6; --surface2:#dfb98a; --line:#a9745f;
  --fg:#2b1810; --muted:#5f4332; --coin:#c97b1a; --ink:#5b4657;
  --fang:#d9533f; --steel:#3f86c4; --spore:#6f9f2e; --ether:#8f63d6;
  --good:#5b9a3c; --bad:#c4473e;
  --font-display:'Kechusilka',system-ui,sans-serif;
  --font-body:'Kechusilka',system-ui,sans-serif;
  --font-mono:'Kechusilka',system-ui,sans-serif;
  color-scheme:light;
}
html,body{image-rendering:pixelated}
body{background-color:#86b254;background-image:conic-gradient(#7fab4e 25%,#0000 0 50%,#7fab4e 0 75%,#0000 0);background-size:32px 32px;font-size:25px;line-height:1.35;
  cursor:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABM0lEQVR42sWSsUoDQRCGvwu5RoiVlSSQp8hDCHYBOTsLm8QiJJFAQLhKAlGwOJ/hLNL4AFbpkjZNDgstziMQCXcXq2DWQnbZxL1YWPjDwMzPzD+zMwt/hGUi6+2GkP79zZ2lczKWyJuKe25HpwSAxgldJGfq/P70oThZKLme29mYMK8Xd1s1AK5vPS65wK6s2S8UOD05hjfzDtQEs3DGavQddls1+kMPgCRNKRdLhIevuwUA+kNvQ0RHuVjKPkXVcUQYBSKMAlFvN5T/8visLIwCkS4jZXIPaoLtzjLWkaSp+QkD37faD1esRjkWSbyREM+X2JV1poi6wsD3LUC4bpNFEvM5twE4ONr70fXsvCnzzfuYTMfK5D7CKBCT6VhUHUf8+r+3RaSZiq1dIttc5tj/ii/kwcHKXwY6PwAAAABJRU5ErkJggg==) 2 2,auto}
body::before{background:#86b254}
button,.tap,.mc,.unit.tgt,.tp-cell.slot{cursor:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABL0lEQVR42mNgoBAwogtklxT8h7Gn9kxgRBaD8ZEBC7rmjoZyZKH/DAwMDEhi/9ENYUI38e3er3A2TCNMrKOhHMWFWA3oPjyF4e3erwyfPn9mYGBgYIgK98UbBizIzq8qzmJgYGBgWLxmLUOsWSDDp8+fGRRkZBkeMDxkEGbQwm8AAwMDw/tPH7EqUpCRRfcWPCxYYLZ7uNoz3H/whOHLl28MZ45dYIiQC4ZrYjX7h9MLTAwMDAwvn75kMNLTZjDS02ZYu2YLQ09EM4ZCWJhgNQDmfHQvfHzzBcV2bIawMDAwMKxZvpwRFucNDUUMH498YWBgYGAQ8eLC0JCYWgRTj+oCZEFmm98MzDa/GdADOL+oHkUdVhASGfn/ys3TGDgkMvI/UXkBZgi6GEGbBwwAABiXiVRciQHJAAAAAElFTkSuQmCC) 4 2,pointer}
svg{image-rendering:auto}
.app{padding-bottom:118px}

/* шапка */
.top{background:none;border:0;padding:10px 0 6px}
.logo{color:#fff6dc;font-size:23px;text-shadow:2px 2px 0 #5b3a29,-1px 0 0 #5b3a29,0 -1px 0 #5b3a29,1px 0 0 #5b3a29}
.logo small{color:#e9f5c8;font-size:17px;text-shadow:1px 1px 0 #5b3a29}
.chip i{width:16px;height:16px;border-radius:0;transform:none;background:var(--i-special) -96px -16px/112px 64px no-repeat}
.chip.stage i{background-position:0 -16px;transform:none;border-radius:0}
.dq-dot{border-radius:0;background:var(--bad);border-color:#fff6dc}

/* 9-slice: средние плитки */
.panel,.sheet{border-width:12px 12px 16px;border-style:solid;border-color:transparent;
  background:none;border-radius:0;
  border-image:var(--i-cream) 6 6 8 6 fill/12px 12px 16px stretch;padding:4px 2px 2px}
.sheet{padding:10px 8px 6px}
.panel{margin-top:10px}
.btn,.chip,.dq-btn,.mc,.tp-cell,.dqs li,.tk,.rw,.rstats div,.tstats div,.lb li,.streak,.bingo-note,.seg button,.seg5 button,.atabs button,.stars-sel .btn,.starbtn,.chartbtn,.new{
  border-style:solid;border-color:transparent;border-width:10px 10px 12px;border-radius:0;background:none;box-shadow:none;
  border-image:var(--i-tan) 5 5 7 5 fill/10px 10px 12px stretch}
.btn{padding:2px 6px;min-height:46px}
.chip{padding:0 2px;border-width:8px 8px 10px;border-image-width:8px 8px 10px;gap:4px}
.dq-btn{width:44px;height:44px;border-width:10px 10px 12px;color:var(--fg)}
.chartbtn{width:38px;height:38px;border-width:8px 8px 10px;border-image-width:8px 8px 10px;color:var(--fg)}
.starbtn{width:44px;height:44px;border-radius:0;color:var(--fg)}
.new{border-width:5px;border-image-width:5px;border-image-slice:5;padding:0 4px;background:none;color:var(--fg);font-size:17px}
.btn:hover,.dq-btn:hover,.chartbtn:hover{border-color:transparent;filter:brightness(1.06)}
.btn:active,.btn.on,.mc.sel,.seg button.on,.seg5 button.on,.atabs button.on,.tk.on,.stars-sel .btn.on,.starbtn.on,.sd.now,.rw.done{
  border-image-source:var(--i-tanp);color:var(--on)}
.btn.primary{border-image-source:var(--i-brown);background:none;color:#fff3d6;text-shadow:0 2px 0 #6e4132;font-size:23px;letter-spacing:.04em}
.btn.primary:active{filter:brightness(.9)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;filter:grayscale(.7)}
.mc{padding:0 0 2px}
.mc.empty,.tp-cell.empty{opacity:.55;border-style:solid}
.mc.sel{filter:drop-shadow(2px 0 0 #f2b13e) drop-shadow(-2px 0 0 #f2b13e) drop-shadow(0 2px 0 #f2b13e) drop-shadow(0 -2px 0 #f2b13e)}
.tp-cell,.dqs li,.tk,.rw,.lb li,.streak{padding:0;border-width:8px 8px 10px;border-image-width:8px 8px 10px}
.tp-cell{padding:0 2px}
.dqs li,.tk,.lb li,.rw,.streak{padding:0 4px}
.rstats div,.tstats div{padding:2px}
.seg button,.seg5 button{min-height:46px;border-width:8px 8px 10px;border-image-width:8px 8px 10px;padding:0}
.atabs{background:none;border:0;padding:0;gap:6px}
.atabs button{padding:2px 2px 4px;border-width:8px 8px 10px;border-image-width:8px 8px 10px;box-shadow:none;color:var(--muted)}
.atabs button.on{box-shadow:none;color:var(--on)}
.stars-sel .btn{padding:2px}
.bingo-note{border-image-width:10px 10px 12px;padding:2px 4px}
.tp-bar{background:none;border:0;margin:8px -8px -6px;bottom:-6px;padding:8px 8px 4px;border-image:var(--i-cream) 6 6 8 6 fill/12px 12px 0 stretch;border-style:solid;border-color:transparent;border-width:12px 12px 0}

/* мелкие плитки */
.sd,.stats div,.bc,.cx{border-style:solid;border-color:transparent;border-width:8px 8px 10px;border-radius:0;background:none;
  border-image:var(--i-tan) 4 4 6 4 fill/8px 8px 10px stretch}
.sd{padding:0}.sd.got{opacity:.7}.sd.now{box-shadow:none}
.stats div{padding:0 2px}
.bc{padding:0}
.bc.won{box-shadow:none;border-image-source:var(--i-tanp)}
.cx{padding:0 2px}
.bc .nm{font-size:16px}

/* рамки мутантов */
.art{border:9px solid transparent;border-radius:0;background-clip:padding-box;
  border-image:var(--i-frame) 9 9 9 9/9px stretch}
.unit .art{border:0;border-image:none;background:none}
.badge{background:var(--surface);border:2px solid var(--line);border-radius:0;color:var(--fg)}
.badge.boss{background:var(--bad);color:#fff6dc;border-color:#7d241d}
.mc.tiered .art{box-shadow:inset 0 0 0 2px var(--tc)}
.pips i,.xp,.bar{border-radius:0}
.pips i{height:10px;background:var(--ink);border:2px solid #3d2e3b}
.pips i.on{background:#f2b13e;border-color:#a8680f}
.xp{height:10px;background:var(--ink);border:2px solid #3d2e3b}
.xp i{background:var(--steel)}
.bar{height:10px;background:var(--ink);border:2px solid #3d2e3b;margin-top:4px}
.bar i{box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.unit .bar{height:10px}
.bar i.mid{background:#f2b13e}
.gi{shape-rendering:crispEdges}

/* арена боя */
.battle .field{border-style:solid;border-color:transparent;border-width:10px 10px 12px;padding:2px 0;
  border-image:var(--i-tan) 5 5 7 5 fill/10px 10px 12px stretch}
.field::before{border-left:2px dashed var(--line)}
.field::after{background:var(--surface);color:var(--fg);padding:4px;border:2px solid var(--line)}
.pop{font-size:34.5px;text-shadow:0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000}
.unit .stat-row{color:var(--fg)}

/* нижние панели: деревянная доска и иконки вкладок */
.tabs,.dock{background:none;border-style:solid;border-color:transparent;border-width:12px 0 0;border-radius:0;
  border-image:var(--i-wood) 6 6 8 6 fill/12px 0 0 0 stretch}
.tabs{padding-top:0}
.tabs div{gap:6px}
.tab{display:grid;justify-items:center;gap:0;font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:0;color:#fff3d6;text-shadow:0 1px 0 #6e4132;padding:2px 0 4px;border:8px solid transparent;border-width:6px 6px 8px;border-radius:0;background:none}
.tab .ti{width:32px;height:32px;background:var(--i-icons) 0 0/576px 96px no-repeat;image-rendering:pixelated}
.tab.on{border-image:var(--i-cream) 6 6 8 6 fill/12px 12px 16px stretch;border-width:12px 12px 16px;padding:0;color:var(--fg);text-shadow:none;background:none;border-color:transparent;margin:-6px 0 -8px}
.tab.on .ti{background-position-x:var(--bx2)}
.tab .ti{background-position:var(--bx) var(--by)}
.tab.on .ti{background-position:var(--bx2) var(--by)}
.dock .hint{color:#fff3d6;text-shadow:0 1px 0 #6e4132}
.dock .btn small{color:var(--muted)}
.dock .ctrl .btn[data-act="auto"],.dock .ctrl .btn[data-act="retreat"]{min-height:38px}

/* окна, списки */
.overlay{background:rgba(52,34,28,.7)}
.lb li:nth-child(2) .pos{color:#6c7f8c}.lb li:nth-child(3) .pos{color:#a2561f}
.lb .sc{color:var(--coin)}
.starwrap span{color:var(--coin)}
.sb{background:rgba(77,50,38,.2)}
.shop .btn.buy::before{border-radius:0;width:16px;height:16px;background:var(--i-special) -96px -16px/112px 64px no-repeat}
.sheet h3{font-size:28px}

.chip i,.chip.stage i{background-color:transparent!important}
.atabs button.on,.tab.on{background:none!important}
.tab{text-transform:none;font-size:17px}
.atabs button{font-size:19px}
.chip.stage i{background:var(--i-special) 0 -16px/112px 64px no-repeat transparent!important}
.seg5 button.on,.seg button.on,.stars-sel .btn.on,.tk.on,.mc.sel{box-shadow:none!important}
.mid .rd,.mid .lg,.hint{color:#fff6dc;text-shadow:1px 1px 0 #5b3a29}
.dock .hint{color:#fff3d6}

/* бинго: переделка */
.bingo{grid-template-columns:22px repeat(5,minmax(0,1fr));gap:6px 5px;margin:8px 0 4px}
.bh{min-height:0}
.bc,.bc.won{border:0;border-image:none;background:none;padding:0}
.bc .art{border:3px solid #3d2e3b;border-image:none;background-clip:border-box;border-radius:0;box-shadow:0 3px 0 #a9745f}
.bc .nm{font-size:16px;margin-top:5px;line-height:1.1;color:var(--fg)}
.bc.lock .nm{display:none}
.bc.lock .art{background:#6b5666}
.bc.lock .art::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:34.5px;color:#fff6dc;opacity:.6;text-shadow:0 2px 0 #3d2e3b}
.bc.lock .art svg{filter:brightness(0) opacity(.1)}
.bc.won .art{border-color:var(--bwc,#f2b13e);box-shadow:0 3px 0 #a9745f,0 0 0 2px #fff6dc}
.bc:not(.lock):not(.won) .art{border-color:#fff6dc}
.rwlist{gap:6px}
.rw{padding:0 2px;gap:2px}
.rw .sub{font-size:19px;line-height:1.25}
.rw-top b{font-size:20.5px}
.rw .xp{height:12px;margin:4px 0 2px!important;background:#6b5666;border:2px solid #3d2e3b;position:relative}
.rw .xp i{background:#f2b13e;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.rw .xp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(61,46,59,.55) 6px 8px);pointer-events:none}
.rw.done .xp i{background:var(--good)}
.rw.done .rw-top .meta{color:var(--good);font-weight:700}
.rw.done{opacity:.85}
.top .dq-btn{width:40px;height:40px;border-width:8px 8px 10px;border-image-width:8px 8px 10px}
.top .chip{border-width:8px 6px 10px;border-image-width:8px 6px 10px}
.logo{font-size:20.5px}
.logo small{font-size:16px}
::selection{background:#f2b13e;color:#4d3226}
</style>

const TIER_BONUS = 0.25;        // каждый тир: +25% к здоровью и атаке от обычного (серебряный = +50%)
const MERGE_START_LVL = 1;      // с какого уровня начинает мутант после слияния
const tierOf = m => (m && m.tier) || 0;
const BREED_COST = 30, SAMPLE_COST = 40, HYBRID_COST = 90, RELEASE_REFUND = 8, COLLECTION_CAP = 12;
const xpNeed = l => 18 + 8 * l;
/* ---------- ТРЕНИРОВОЧНЫЙ ПОЛИГОН ---------- */
const TRAIN_XP_BASE = 10, TRAIN_XP_PCT = 0.11, TRAIN_LOSE_SHARE = 0.3;   // победа: 10 + 11% от опыта до следующего уровня (по среднему уровню команды); поражение: 30% от награды за победу
const trainAvgLvl = team => { const a = (team || []).filter(Boolean); return a.length ? Math.max(1, Math.round(a.reduce((t, m) => t + m.lvl, 0) / a.length)) : 1; };
const trainWinXp = avg => Math.round(TRAIN_XP_BASE + TRAIN_XP_PCT * xpNeed(avg));
const trainLoseXp = avg => Math.round(trainWinXp(avg) * TRAIN_LOSE_SHARE);
const trainFoeRange = avg => [Math.max(1, avg - 2), Math.max(1, avg - 1)];   // враги полигона: на 1–2 уровня слабее команды, минимум 1
const TRAIN_STREAK_STEP = 0.1, TRAIN_STREAK_CAP = 10;      // каждая победа подряд: +10% к опыту, максимум ×2 (на 10-й победе подряд и дальше)
const trainMult = n => 1 + TRAIN_STREAK_STEP * Math.min(n || 0, TRAIN_STREAK_CAP);   // n = сколько побед подряд уже есть
const fmtMult = x => String(Math.round(x * 10) / 10).replace('.', ',');
function genTrainSpec(team) {
  const [foeLo, foeHi] = trainFoeRange(trainAvgLvl(team));
  const units = [0, 1, 2].map(() => ({
    g: [rndGene(), rndGene()],
    lvl: foeLo + Math.floor(Math.random() * (foeHi - foeLo + 1)),
    gen: 0
  }));
  return { stage: 0, boss: false, train: true, units };
}
const upgradeCost = l => 20 + 12 * l;

/* ---------- ЕЖЕДНЕВНЫЕ ЗАДАНИЯ ---------- */
const DQ_POOL = [
  { t: 'win',     n: 3, base: 60 },
  { t: 'fight',   n: 5, base: 50 },
  { t: 'breed',   n: 2, base: 40 },
  { t: 'upgrade', n: 2, base: 50 }
];
const DQ_NAME = { login: 'Вход в игру', win: 'Выиграй бои на арене', fight: 'Проведи бои', breed: 'Скрести мутантов', upgrade: 'Прокачай мутантов за монеты' };
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };   // цена повышения с уровня l на l+1

function calcStats(m, boost = 1, bonus = null) {
  const a = GENES[m.g[0]], b = GENES[m.g[1]];
  const lv = 1 + 0.18 * (m.lvl - 1), gn = 1 + 0.08 * m.gen;
  const tm = 1 + TIER_BONUS * (m.tier || 0);
  const f = k => (a[k] * 0.65 + b[k] * 0.35) * lv * gn * boost * tm;
  const hpM = bonus ? (bonus.hp[m.g[0]] || 1) * bonus.all : 1;
  const atkM = bonus ? (bonus.atk[m.g[1]] || 1) * bonus.all : 1;
  return {
    hp: Math.round(f('hp') * hpM),
    atk: Math.round(f('atk') * atkM * 10) / 10,
    spd: Math.round((a.spd * 0.65 + b.spd * 0.35) * 10) / 10
  };
}

function breedGenes(a, b) {
  let g1 = a.g[Math.random() < 0.5 ? 0 : 1];
  let g2 = b.g[Math.random() < 0.5 ? 0 : 1];
  let mutated = false;
  if (Math.random() < 0.08) {
    const r = GENE_IDS[Math.floor(Math.random() * GENE_IDS.length)];
    if (Math.random() < 0.5) g1 = r; else g2 = r;
    mutated = true;
  }
  const g = Math.random() < 0.5 ? [g1, g2] : [g2, g1];
  return { g, gen: Math.min(5, Math.max(a.gen, b.gen) + 1), mutated };
}

function addXp(m, x) {
  const ups = [];
  m.xp += x;
  while (m.xp >= xpNeed(m.lvl)) {
    m.xp -= xpNeed(m.lvl);
    m.lvl++;
    ups.push(m.lvl);
  }
  return ups;
}

/* ---------- Враги ---------- */
const rndGene = () => GENE_IDS[Math.floor(Math.random() * GENE_IDS.length)];

function genFoeSpec(stage) {
  const lvl = 1 + Math.floor((stage - 1) * 0.7);
  const gen = Math.min(4, Math.floor(stage / 6));
  const boss = stage % 5 === 0;
  const units = [0, 1, 2].map(i => ({
    g: [rndGene(), rndGene()],
    lvl: Math.max(1, lvl + (boss && i === 1 ? 1 : 0) - (Math.random() < 0.3 ? 1 : 0)),
    gen
  }));
  return { stage, boss, units };
}
const foeBoost = spec => (spec.boss ? 1.25 : 1) * (spec.stage < 3 ? 0.85 : 1) * (1 + 0.03 * Math.max(0, spec.stage - 18));

/* ---------- Бой ---------- */
function makeUnit(m, side, idx, boost = 1, tag = '', bonus = null) {
  const st = calcStats(m, boost, bonus);
  return {
    id: side + idx, side, g: m.g, lvl: m.lvl, gen: m.gen, tier: m.tier || 0, ref: m,
    name: speciesName(m.g[0], m.g[1]), tag,
    hp: st.hp, max: st.hp, atk: st.atk, spd: st.spd,
    cd: 2, poison: 0, poisonDmg: 0, alive: true
  };
}

function newBattle(allyMutants, foeSpec, bonus = null) {
  const allies = allyMutants.map((m, i) => makeUnit(m, 'a', i, 1, '', bonus));
  const b = foeBoost(foeSpec);
  const foes = foeSpec.units.map((u, i) =>
    makeUnit({ g: u.g, lvl: u.lvl, gen: u.gen, xp: 0 }, 'f', i, b, foeSpec.boss && i === 1 ? 'босс' : ''));
  return { allies, foes, queue: [], round: 0 };
}

const alive = arr => arr.filter(u => u.alive);
function outcome(B) {
  if (!alive(B.foes).length) return 'win';
  if (!alive(B.allies).length) return 'lose';
  if (B.round > 40) return 'lose';
  return null;
}

function applyDamage(t, d, ev, type, eff) {
  t.hp = Math.max(0, t.hp - d);
  if (t.hp === 0) t.alive = false;
  ev.push({ id: t.id, type, val: d, eff: eff || '' });
}

function nextActor(B) {
  const ev = [];
  for (;;) {
    if (outcome(B)) return { u: null, ev };
    if (!B.queue.length) {
      B.round++;
      if (outcome(B)) return { u: null, ev };
      B.queue = [...alive(B.allies), ...alive(B.foes)]
        .sort((a, b) => (b.spd - a.spd) || (Math.random() - 0.5));
    }
    const u = B.queue.shift();
    if (!u.alive) continue;
    if (u.poison > 0) {
      u.poison--;
      applyDamage(u, u.poisonDmg, ev, 'poison');
      if (!u.alive) continue;
    }
    if (u.cd > 0) u.cd--;
    return { u, ev };
  }
}

function hit(u, t, mult, ev) {
  const eff = BEATS[u.g[0]] === t.g[0] ? 1.25 : (BEATS[t.g[0]] === u.g[0] ? 0.8 : 1);
  const d = Math.max(1, Math.round(u.atk * mult * eff * (0.9 + Math.random() * 0.2)));
  applyDamage(t, d, ev, 'dmg', eff > 1 ? 'up' : eff < 1 ? 'down' : '');
}

function act(B, u, kind, target) {
  const ev = [{ id: u.id, type: 'acts' }];
  const foes = u.side === 'a' ? B.foes : B.allies;
  const mates = u.side === 'a' ? B.allies : B.foes;
  let text;
  if (kind === 'attack') {
    hit(u, target, 1, ev);
    text = `${u.name} бьёт: ${target.name}`;
  } else {
    const g = u.g[0];
    text = `${u.name}: ${GENES[g].sp}`;
    if (g === 'fang') hit(u, target, 2, ev);
    if (g === 'steel') alive(foes).forEach(t => hit(u, t, 0.8, ev));
    if (g === 'spore') {
      hit(u, target, 0.6, ev);
      if (target.alive) {
        target.poison = 3;
        target.poisonDmg = Math.max(1, Math.round(u.atk * 0.4));
        ev.push({ id: target.id, type: 'status' });
      }
    }
    if (g === 'bone') {
      hit(u, target, 1.2, ev);
      const h = Math.min(u.max - u.hp, Math.round(ev[ev.length - 1].val * 0.5));
      if (h > 0) { u.hp += h; ev.push({ id: u.id, type: 'heal', val: h }); }
    }
    if (g === 'ether') {
      const t = alive(mates).sort((x, y) => x.hp / x.max - y.hp / y.max)[0];
      const h = Math.min(t.max - t.hp, Math.round(u.atk * 2.5));
      t.hp += h;
      ev.push({ id: t.id, type: 'heal', val: h });
    }
    u.cd = 3;
  }
  return { ev, text };
}

function aiChoose(B, u) {
  const foes = alive(u.side === 'a' ? B.foes : B.allies);
  const mates = alive(u.side === 'a' ? B.allies : B.foes);
  let kind = 'attack';
  if (u.cd === 0) {
    if (u.g[0] === 'ether') {
      if (mates.some(x => x.hp / x.max < 0.7)) kind = 'special';
    } else kind = 'special';
  }
  let target = null;
  if (!(kind === 'special' && !GENES[u.g[0]].needsTarget)) {
    const sorted = [...foes].sort((a, b) => a.hp - b.hp);
    target = Math.random() < 0.3 ? foes[Math.floor(Math.random() * foes.length)] : sorted[0];
  }
  return { kind, target };
}

function lineProgress(l, seen) {
  const have = l.cells.filter(k => seen[k]).length;
  return { have, total: l.cells.length, done: have === l.cells.length };
}

function bonusFrom(claimed) {
  const b = { hp: {}, atk: {}, all: 1, breedCost: BREED_COST, coinMult: 1 };
  LINES.forEach(l => {
    if (!claimed || !claimed[l.id]) return;
    if (l.kind === 'row') b.hp[l.gene] = (b.hp[l.gene] || 1) * BINGO_ROW_BONUS;
    if (l.kind === 'col') b.atk[l.gene] = (b.atk[l.gene] || 1) * BINGO_COL_BONUS;
    if (l.kind === 'd1') b.breedCost = 20;
    if (l.kind === 'd2') b.coinMult = 1.1;
    if (l.kind === 'all') b.all = 1.1;
  });
  return b;
}

// выдаёт награды за новые собранные линии, возвращает список этих линий
function checkBingo(state) {
  state.claimed = state.claimed || {};
  const got = [];
  LINES.forEach(l => {
    if (!state.claimed[l.id] && lineProgress(l, state.seen).done) {
      state.claimed[l.id] = 1;
      state.coins += l.coins;
      got.push(l);
    }
  });
  // звёздное бинго: за линию из мутантов тира дают токен этого тира
  [1, 2, 3, 4].forEach(t => {
    if (!state.seenT || !state.claimedT) return;
    state.tokens = state.tokens || {};
    LINES.forEach(l => {
      if (!state.claimedT[t][l.id] && lineProgress(l, state.seenT[t]).done) {
        state.claimedT[t][l.id] = 1;
        state.tokens[t] = (state.tokens[t] || 0) + 1;
        got.push(Object.assign({}, l, { tier: t }));
      }
    });
  });
  return got;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  [r, g, b] = [r, g, b].map(x => Math.round((f - x) * p + x));
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

  S.daily = { day, quests: [

    ...pick.map(q => ({ id: q.t, n: q.n, p: 0, r: Math.round(q.base * k), c: 0 }))

      <button class="btn primary" id="labClaim" data-act="lab-claim" ${cur < 1 ? 'disabled' : ''}>Забрать</button>
    </div>
    ${askNotifyHTML()}
  </section>`;
}
function updateLab() {
  const a = $('#labAmt'); if (!a || !a.isConnected) return;
  const rate = labRate(), max = Math.max(1, Math.floor(rate * LAB_CAP_H));
  const cur = Math.min(Math.floor(labPending()), max);
  a.textContent = cur;
  $('#labBar').style.width = Math.round(cur / max * 100) + '%';
  const b = $('#labClaim'); if (b) { if (cur < 1) b.setAttribute('disabled', ''); else b.removeAttribute('disabled'); }
}

function streakHTML() {

  return `<div class="streak">
    <div class="streak-top"><b>Серия побед: ${n}</b><span>следующая победа ×${fmtMult(next)} · +${xp} опыта${n >= TRAIN_STREAK_CAP ? ' (максимум)' : ''}</span></div>

    <p class="sub" style="margin:8px 0 0">Каждая победа подряд даёт +${Math.round(TRAIN_STREAK_STEP * 100)}% опыта, до ×${fmtMult(trainMult(TRAIN_STREAK_CAP))}. Поражение или отступление сбрасывает серию.</p>

}

function viewBreed() {
  const t = starSel, T = TIERS[t];
  const a = byId(picks[0]), b = byId(picks[1]);
  const slot = m => m ? miniCard(m, { act: 'pick' }) : `<div class="mc empty">выбери<br>родителя</div>`;
  const full = activeCount() >= COLLECTION_CAP;
  const own = t ? (S.tokens[t] || 0) : 0;
  const mid = `<div class="starwrap"><button class="starbtn${t ? ' on t' + t : ''}" data-act="star-open" aria-label="Выбрать звезду" title="Звезда для слияния">${t ? tierStar(t, 24) : starOutline(22)}</button><span>${t ? 'сменить' : 'звезда'}</span></div>`;
  let note, action, grid;
  if (t) {
    const ready = !!(a && b && a.id !== b.id && mergeOk(a, t) && mergeOk(b, t) && own > 0 && !full);
    note = `Слияние: нужны 2 мутанта «${TIERS[t - 1].name.toLowerCase()}» или «${T.name.toLowerCase()}» тира не ниже ${T.lvl} уровня и 1 токен (у тебя ×${own}). Родители остаются у тебя, а новый мутант получит +${Math.round(TIER_BONUS * 100 * t)}% к здоровью и атаке и начнёт с ${MERGE_START_LVL}-го уровня.`;
    if (a && b) note = `Получишь ${tierStar(t, 14)} ${T.name.toLowerCase()} мутанта ${MERGE_START_LVL}-го уровня. Гены достанутся случайно от обоих родителей (шанс мутации 8%): ${[...new Set([...a.g, ...b.g])].map(geneChip).join(' ')}`;
    if (full) note = `Мест нет: в коллекции ${COLLECTION_CAP} мутантов. Отпусти кого-нибудь или убери в архив на вкладке «Мутанты».`;
    action = `<button class="btn ${confirmId === 'merge' ? 'danger' : 'primary'} wide" data-act="merge-do" ${ready ? '' : 'disabled'}>${confirmId === 'merge' ? 'Точно слить? Уйдёт 1 токен' : 'Слить · 1 токен'}</button>`
      + (own < 1 ? `<p class="sub center" style="margin:8px 0 0">Нет токена «${T.name.toLowerCase()}»: нажми на звезду между родителями и купи.</p>` : '');
    const ok = active().filter(m => mergeOk(m, t)), no = active().filter(m => !mergeOk(m, t));
    grid = ok.map(m => miniCard(m, { act: 'pick', sel: picks.includes(m.id) })).join('')
      + no.map(m => miniCard(m, { act: 'merge-low', dim: true, meta: (tierOf(m) === t - 1 || tierOf(m) === t) ? `ур.${m.lvl} из ${T.lvl}` : 'не тот тир' })).join('');
  } else {
    const can = a && b && S.coins >= breedCost() && !full;
    note = `Потомок берёт по одному гену от каждого родителя. Шанс мутации 8%. Каждое новое поколение даёт +8% к силе (до 5-го). Звезда между родителями включает слияние.`;
    if (full) note = `Мест нет: в коллекции ${COLLECTION_CAP} мутантов. Отпусти кого-нибудь или убери в архив на вкладке «Мутанты».`;
    else if (a && b) note = `Гены для выбора: ${[...new Set([...a.g, ...b.g])].map(geneChip).join(' ')}`;
    action = `<button class="btn primary wide" data-act="breed" ${can ? '' : 'disabled'}>Скрестить · <span class="price">${breedCost()}</span></button>`;
    grid = active().map(m => miniCard(m, { act: 'pick', sel: picks.includes(m.id) })).join('');
  }
  return `
  <section class="panel">
    <h2 class="h">${t ? 'Слияние: ' + tierStar(t, 16) + ' ' + T.name : 'Скрещивание'}</h2>
    <div class="pair">${slot(a)}${mid}${slot(b)}</div>
    <p class="sub">${note}</p>
    ${action}
  </section>
  <section class="panel">
    <h2 class="h">Родители</h2>
    <div class="gridm">${grid}</div>
  </section>
  ${shopHTML(full)}`;
}

let starSel = 0, mergePick = [], bingoTier = 0;     // starSel: 0 = обычное скрещивание, 1..4 = слияние в этот тир
const mergeOk = (m, t) => !!m && !m.arc && (tierOf(m) === t - 1 || tierOf(m) === t) && m.lvl >= TIERS[t].lvl;   // родители: тот же тир или на 1 ниже
const viewLab = () => viewBreed();
const starOutline = (size = 22) => `<svg class="gi" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.4l2.9 6.1 6.7.9-4.9 4.6 1.2 6.6L12 17.4l-5.9 3.2 1.2-6.6L2.4 9.4l6.7-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;

    <div class="row" style="margin-top:4px"><button class="btn grow" data-act="star-none">Без звезды (скрещивание)</button><button class="btn" data-act="close">Закрыть</button></div>`;

function showMerged(m, fresh = false, mutated = false, bingo = []) {

function shopCard(a, b, full) {
  const pure = a === b, open = pure || S.seen[speciesKey(a, b)];
  const price = pure ? SAMPLE_COST : HYBRID_COST;
  const can = open && !full && S.coins >= price;
  return `<div class="mc shop${open ? '' : ' lock'}" style="cursor:default">
    ${art(a, b)}
    <div class="nm">${open ? speciesName(a, b) : '???'}</div>
    <div class="meta">${geneChip(a)}${pure ? '' : ' ' + geneChip(b)}</div>
    ${open
      ? `<button class="btn buy" data-act="buy" data-id="${a}-${b}" ${can ? '' : 'disabled'}><span class="price">${price}</span></button>`
      : `<div class="meta" style="margin-top:8px;min-height:36px">выведи скрещиванием</div>`}
  </div>`;
}

function shopHTML(full) {
  const pure = GENE_IDS.map(g => shopCard(g, g, full)).join('');
  const hyb = GENE_IDS.flatMap(a => GENE_IDS.filter(b => b !== a).map(b => shopCard(a, b, full))).join('');
  return `<section class="panel">
    <h2 class="h">Магазин видов</h2>
    <p class="sub">Чистые виды продаются всегда. Гибрид появляется в продаже после того, как ты впервые его выведешь. Покупка даёт мутанта 1-го уровня, нулевого поколения.</p>
    <div class="gridm">${pure}</div>

  <section class="panel">
    <h2 class="h">Гибриды</h2>
    <div class="gridm">${hyb}</div>
  </section>`;
}

  <section class="panel">

  </section>`;

function viewBingo() {
  const t = bingoTier, T = TIERS[t], seen = seenOf(t), claimed = claimedOf(t);
  const total = GENE_IDS.length * GENE_IDS.length;
  const found = LINES[LINES.length - 1].cells.filter(k => seen[k]).length;
  const doneKeys = new Set();
  LINES.filter(l => l.kind !== 'all' && claimed[l.id]).forEach(l => l.cells.forEach(k => doneKeys.add(k)));
  const head = GENE_IDS.map(g => `<div class="bh" title="${GENES[g].name}">${geneIcon(g, 18)}</div>`).join('');
  const rows = GENE_IDS.map(a => `<div class="bh" title="${GENES[a].name}">${geneIcon(a, 18)}</div>` +
    GENE_IDS.map(b => {
      const k = speciesKey(a, b), ok = seen[k];
      return `<div class="bc${ok ? '' : ' lock'}${doneKeys.has(k) ? ' won' : ''}">${art(a, b)}<div class="nm">${ok ? speciesName(a, b) : '???'}</div></div>`;
    }).join('')).join('');
  const lines = LINES.map(l => {
    const p = lineProgress(l, seen), got = claimed[l.id];
    return { l, p, got };
  });
  const prize = l => t ? `Награда: ${tierStar(t, 13)} токен «${T.name.toLowerCase()}»` : `${l.desc}. Сразу: +${l.coins} монет.`;
  const list = lines.map(({ l, p, got }) => `<div class="rw${got ? ' done' : ''}">
      <div class="rw-top"><b>${l.title}</b><span class="meta">${got ? 'получено' : p.have + '/' + p.total}</span></div>
      <div class="sub" style="margin:0">${prize(l)} <span class="meta">${l.label}</span></div>
      <div class="xp" style="margin:2px 0 0"><i style="width:${Math.round(p.have / p.total * 100)}%"></i></div>
    </div>`).join('');
  const open = lines.filter(x => !x.got && x.l.kind !== 'all').sort((a, b) => (b.p.have / b.p.total) - (a.p.have / a.p.total))[0];
  let next = '';
  if (open) {
    const miss = open.l.cells.filter(k => !seen[k]).map(k => { const [a, b] = k.split('-'); return speciesName(a, b); });
    next = `<p class="sub" style="margin:10px 0 0">Ближе всего: «${open.l.title}». Не хватает: ${miss.join(', ')}.</p>`;
  }
  const seg = `<div class="seg5">${[0, 1, 2, 3, 4].map(k => `<button class="${bingoTier === k ? 'on' : ''}" data-act="bingo-tier" data-id="${k}" aria-label="${TIERS[k].name}">${k ? tierStar(k, 20) : 'Обычное'}</button>`).join('')}</div>`;
  const intro = t
    ? `${T.name} бинго: собери мутантов этого тира. Строка это первый ген, столбец это второй. За каждую линию получишь токен «${T.name.toLowerCase()}» (сейчас у тебя ×${S.tokens[t] || 0}). Клетку закрашивает только мутант именно ${T.name.toLowerCase()} тира.`
    : `Строка это первый ген, столбец это второй. Каждый новый вид закрашивает клетку. Собрал линию: получи монеты и постоянный бонус.`;
  return `
  <section class="panel">
    ${seg}
    <h2 class="h">${t ? T.name + ' бинго' : 'Бинго видов'} · ${found}/${total}</h2>
    <p class="sub">${intro}</p>
    <div class="bingo"${t ? ` style="--bwc:${T.color}"` : ''}><div></div>${head}${rows}</div>
    ${next}
  </section>
  <section class="panel">
    <h2 class="h">Награды · ${Object.keys(claimed).length}/${LINES.length}</h2>
    <div class="rwlist">${list}</div>
  </section>`;
}

function render() {
  renderTop();
  document.body.classList.toggle('in-battle', !!Bt);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  if (Bt) return;
  $('#view').innerHTML = tab === 'arena' ? viewArena() : tab === 'lab' ? viewLab() : tab === 'bingo' ? viewBingo() : tab === 'top' ? viewTop() : viewMutants();
}

function upgradeHTML(m, st) {
  const nx = calcStats({ g: m.g, lvl: m.lvl + 1, gen: m.gen, tier: m.tier }, 1, bonus());

function dailyHTML() {

    const done = q.p >= q.n;
    const meta = q.id === 'login' ? `День ${q.d || 1} серии · бесплатно` : `${Math.min(q.p, q.n)} / ${q.n}`;

const powerOf = m => { const st = calcStats(m, 1, bonus()); return st.hp * st.atk; };
function tpHint(m) {
  let up = 0, dn = 0;
  S.foe.units.forEach(f => { if (effOf(m, f) > 1) up++; if (effOf(f, m) > 1) dn++; });
  return { up, dn };
}
function tpScore(m) {                                  // сила с поправкой на слабости и преимущества против текущих врагов
  const fs = S.foe.units, n = fs.length || 1;
  const off = fs.reduce((a, f) => a + effOf(m, f), 0) / n;
  const def = fs.reduce((a, f) => a + 1 / effOf(f, m), 0) / n;
  return powerOf(m) * off * def;
}

function startBattle(train = false) {
  const team = S.team.map(byId).filter(Boolean);
  if (!team.length) return;
  const B = newBattle(team, train ? genTrainSpec(team) : S.foe, bonus());
  Bt = { B, cur: null, mode: 'attack', auto: false, busy: false, over: false, timer: null, stage: S.stage, train };
  const me = Bt;
  $('#view').innerHTML = `<div class="battle">
    ${chartBtn()}
    <div class="mid"><div class="rd" id="rd"></div><div class="lg" id="lg"></div></div>
    <div class="field">
      <div class="col left" id="allies">${B.allies.map(unitHTML).join('')}</div>

    </div>
    <div class="dock"><div class="hint" id="hint"></div><div class="ctrl" id="ctrl"></div></div>
  </div>`;
  document.body.classList.add('in-battle');
  window.scrollTo(0, 0);
  updateBattle();
  me.timer = setTimeout(() => { if (Bt === me) battleLoop(); }, 500);

function updateBattle() {
  if (!Bt) return;
  const { B, cur } = Bt;
  const all = [...B.allies, ...B.foes];
  const playerTurn = cur && cur.side === 'a' && !Bt.auto && !Bt.busy && !Bt.over;
  const needT = playerTurn && (Bt.mode === 'attack' || GENES[cur.g[0]].needsTarget);
  all.forEach(u => {
    const el = $('#u-' + u.id); if (!el) return;
    const vh = u.vhp !== undefined ? u.vhp : u.hp, va = u.valive !== undefined ? u.valive : u.alive;
    const p = vh / u.max;
    const bar = el.querySelector('.bar i');
    bar.style.width = (p * 100) + '%';
    bar.className = p < 0.25 ? 'low' : p < 0.55 ? 'mid' : '';
    el.querySelector('.hpn').textContent = vh + '/' + u.max;
    el.querySelector('.st').innerHTML = va
      ? (u.poison > 0 ? `<span class="pz">яд ${u.poison}</span>` : '') + (u.side === 'a' ? (u.cd > 0 ? ` ⟳${u.cd}` : ' ✦') : '')
      : '';
    el.classList.toggle('dead', !va);
    el.classList.toggle('cur', !!cur && cur.id === u.id && !Bt.over);
    el.classList.toggle('tgt', !!needT && u.side === 'f' && va);
  });
  $('#rd').textContent = (Bt.train ? 'Полигон' : 'Стадия ' + Bt.stage) + ' · Раунд ' + Math.max(1, B.round);
  const ctrl = $('#ctrl'), hint = $('#hint');
  const dock = document.querySelector('.dock'); if (dock) dock.classList.toggle('off', !!Bt.over);
  if (Bt.over) { ctrl.innerHTML = ''; hint.textContent = ''; return; }
  const g = cur ? GENES[cur.g[0]] : null;
  if (playerTurn) {
    hint.textContent = `Ходит ${cur.name}. ` + (Bt.mode === 'special' && g.needsTarget ? 'Выбери цель для приёма.' : 'Нажми на врага, чтобы ударить.');
  } else {
    hint.textContent = Bt.auto ? 'Автобой' : (cur ? `Ходит ${cur.name}` : '');
  }
  const spReady = playerTurn && cur.cd === 0;
  ctrl.innerHTML = `
    <button class="btn ${Bt.mode === 'attack' ? 'on' : ''}" data-act="mode-attack" ${playerTurn ? '' : 'disabled'}>Удар<small>по цели</small></button>
    <button class="btn ${Bt.mode === 'special' ? 'on' : ''}" data-act="mode-special" ${spReady ? '' : 'disabled'}>${g && cur.side === 'a' ? g.sp : 'Спецприём'}<small>${cur && cur.side === 'a' ? (cur.cd > 0 ? 'ещё ' + cur.cd + ' хода' : 'готов') : '—'}</small></button>
    <button class="btn ${Bt.auto ? 'on' : ''}" data-act="auto">Автобой</button>
    <button class="btn" data-act="retreat">Отступить</button>`;
}

function pop(id, text, cls) {
  const el = $('#u-' + id); if (!el) return;
  const s = document.createElement('span');

  el.appendChild(s);

}
function playEvents(ev) {
  ev.forEach(e => {
    const el = $('#u-' + e.id); if (!el) return;
    if (e.type === 'acts') {
      const c = 'lunge-' + e.id[0];
      el.classList.remove('lunge-a', 'lunge-f'); void el.offsetWidth; el.classList.add(c);
    }
    if (e.type === 'dmg' || e.type === 'poison') {
      el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
      pop(e.id, '-' + e.val, e.type === 'poison' ? 'pz' : e.eff === 'up' ? 'up' : e.eff === 'down' ? 'down' : 'dm');

/* ---------- АНИМАЦИИ АТАК ---------- */
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function fxLayer() {
  const f = document.querySelector('.field'); if (!f) return null;
  let l = f.querySelector('.fx');
  if (!l) { l = document.createElement('div'); l.className = 'fx'; f.appendChild(l); }
  return l;
}
function fxPos(el, L) {
  const s = el.querySelector('.art') || el, r = s.getBoundingClientRect(), b = L.getBoundingClientRect();
  return { x: r.left - b.left + r.width / 2, y: r.top - b.top + r.height / 2, bottom: r.bottom - b.top };
}
function fxMake(L, css, html) {
  const d = document.createElement('div'); d.className = 'fxe'; d.style.cssText = css;
  if (html) d.innerHTML = html;
  L.appendChild(d); return d;
}
function fxAnim(el, frames, opt) {
  const a = el.animate(frames, Object.assign({ fill: 'both' }, opt));
  a.onfinish = () => el.remove();
  return a;
}
function fxSparks(L, x, y, n, col, dist, size, dur) {
  for (let i = 0; i < n; i++) {
    const ang = Math.PI * 2 * i / n + Math.random() * 0.7, d = dist * (0.6 + Math.random() * 0.6);
    const p = fxMake(L, `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;border-radius:50%;background:${col}`);
    fxAnim(p, [{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(ang) * d}px,${Math.sin(ang) * d}px) scale(.3)`, opacity: 0 }], { duration: dur, easing: 'ease-out' });
  }
}
function fxGlow(el, color, dur) {      // подсветка спрайта
  (el.querySelector('.art') || el).animate([{ filter: 'none' }, { filter: `drop-shadow(0 0 9px ${color}) brightness(1.2)`, offset: .35 }, { filter: 'none' }], { duration: dur });
}
function fxHop(el, px, dur) {
  (el.querySelector('.art') || el).animate([{ transform: 'none' }, { transform: `translateY(${-px}px)`, offset: .4 }, { transform: 'none' }], { duration: dur });
}

const FX = {};

/* Клык: подбегает и кусает (спецприём: два укуса) */
FX.fang = c => {
  const { u, L, dmg } = c, A = $('#u-' + u.id), T = $('#u-' + dmg[0].id);
  const a = fxPos(A, L), t = fxPos(T, L);
  const dx = (t.x - a.x) * 0.78, dy = (t.y - a.y) * 0.78;
  const dash = 240, gap = 210, ret = 240, total = dash + 40 + dmg.length * gap + ret;
  A.style.zIndex = 8;
  const an = A.animate([
    { transform: 'translate(0,0)', offset: 0, easing: 'cubic-bezier(.6,0,.9,.6)' },
    { transform: `translate(${dx}px,${dy}px) scale(1.1)`, offset: dash / total },
    { transform: `translate(${dx}px,${dy}px) scale(1.1)`, offset: (total - ret) / total },
    { transform: 'translate(0,0)', offset: 1 }
  ], { duration: total });
  an.onfinish = an.oncancel = () => { A.style.zIndex = ''; };
  const times = dmg.map((e, i) => dash + 30 + i * gap);
  times.forEach(ms => c.at(ms - 90, () => {
    const jaw = '<path d="%D" fill="#fff" stroke="#8c1f12" stroke-width="3" stroke-linejoin="round"/>';
    const top = 'M4 6H70V22L63 16 56 30 49 16 42 30 35 16 28 30 21 16 14 30 7 16 4 22Z';
    const bot = 'M4 68H70V52L63 58 56 44 49 58 42 44 35 58 28 44 21 58 14 44 7 58 4 52Z';
    const el = fxMake(L, `left:${t.x - 37}px;top:${t.y - 37}px;width:74px;height:74px`,
      `<svg width="74" height="74" viewBox="0 0 74 74" style="overflow:visible"><g class="jt">${jaw.replace('%D', top)}</g><g class="jb">${jaw.replace('%D', bot)}</g></svg>`);
    el.querySelector('.jt').animate([{ transform: 'translateY(-30px)' }, { transform: 'translateY(0)' }], { duration: 90, fill: 'both', easing: 'ease-in' });
    el.querySelector('.jb').animate([{ transform: 'translateY(30px)' }, { transform: 'translateY(0)' }], { duration: 90, fill: 'both', easing: 'ease-in' });
    fxAnim(el, [{ opacity: 1 }, { opacity: 1, offset: .55 }, { opacity: 0 }], { duration: 300 });
    c.at(90, () => {
      const b = fxMake(L, `left:${t.x - 40}px;top:${t.y - 40}px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,87,.85),rgba(255,107,87,0) 68%)`);
      fxAnim(b, [{ transform: 'scale(.4)', opacity: 1 }, { transform: 'scale(1.3)', opacity: 0 }], { duration: 260, easing: 'ease-out' });
      fxSparks(L, t.x, t.y, 6, '#ff6b57', 34, 5, 300);
    });
  }));
  return { times, total };
};

/* Сталь: выстрел и взрыв (спецприём: залп по всем врагам) */
FX.steel = c => {
  const { u, L, dmg } = c, A = $('#u-' + u.id), a = fxPos(A, L);
  const tp = dmg.map(e => fxPos($('#u-' + e.id), L));
  const dir = tp[0].x >= a.x ? 1 : -1, sx = a.x + dir * 26, sy = a.y - 6, flight = 250;
  (A.querySelector('.art') || A).animate([{ transform: 'none' }, { transform: `translateX(${-dir * 8}px) scale(.94,1.06)`, offset: .25 }, { transform: 'none' }], { duration: 260 });
  const times = [];
  dmg.forEach((e, i) => {
    const t = tp[i], start = i * 110;
    c.at(start, () => {
      const m = fxMake(L, `left:${sx - 11}px;top:${sy - 11}px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff,#9fd6ff 55%,rgba(90,169,230,0) 72%)`);
      fxAnim(m, [{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(1.4)', opacity: 0 }], { duration: 160, easing: 'ease-out' });
    });
    [0, 30, 60].forEach((lag, k) => c.at(start + lag, () => {
      const sz = 16 - k * 4;
      const sh = fxMake(L, `left:0;top:0;width:${sz}px;height:${sz}px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fd6ff 45%,#3b86c9);box-shadow:0 0 10px #5aa9e6;opacity:${1 - k * .3}`);
      const o = sz / 2;
      fxAnim(sh, [
        { transform: `translate(${sx - o}px,${sy - o}px)` },
        { transform: `translate(${(sx + t.x) / 2 - o}px,${(sy + t.y) / 2 - o - 26}px)`, offset: .5 },
        { transform: `translate(${t.x - o}px,${t.y - o}px)` }
      ], { duration: flight, easing: 'linear' });
    }));
    c.at(start + flight, () => {

function land(me, e) {
  const x = [...me.B.allies, ...me.B.foes].find(q => q.id === e.id);
  if (x && x.vhp !== undefined) {
    if (e.type === 'dmg' || e.type === 'poison') { x.vhp = Math.max(0, x.vhp - e.val); x.valive = x.vhp > 0; }
    if (e.type === 'heal') x.vhp = Math.min(x.max, x.vhp + e.val);
  }
  playEvents([e]);
  updateBattle();
}

// Запускает анимацию действия. Возвращает длительность в мс.
function playAction(me, u, kind, ev) {
  const dmg = ev.filter(e => e.type === 'dmg'), heal = ev.filter(e => e.type === 'heal');
  const L = REDUCED ? null : fxLayer(), fn = FX[u.g[0]];
  let plan = null;
  if (L && fn && (dmg.length || heal.length)) {
    const c = { me, u, kind, L, dmg, heal, at: (ms, f) => setTimeout(() => { if (Bt === me) f(); }, ms) };
    try { plan = fn(c); } catch (err) { plan = null; }
  }
  if (!plan) {                                          // без анимации: всё сразу, как раньше
    [...me.B.allies, ...me.B.foes].forEach(x => { delete x.vhp; delete x.valive; });
    playEvents(ev);
    return 0;
  }
  let di = 0;
  const last = Math.max(0, ...plan.times);
  ev.forEach(e => {
    if (e.type === 'acts') return;
    const ms = e.type === 'dmg' ? (plan.times[di++] ?? plan.total) : (plan.healAt !== undefined ? plan.healAt : last + 40);
    setTimeout(() => { if (Bt === me) land(me, e); }, ms);
  });
  setTimeout(() => { if (Bt === me) L.querySelectorAll('.fxe').forEach(n => n.remove()); }, plan.total + 600);
  return plan.total;
}

function battleLoop() {
  const me = Bt; if (!me) return;
  [...me.B.allies, ...me.B.foes].forEach(x => { delete x.vhp; delete x.valive; });
  const r = nextActor(me.B);
  playEvents(r.ev);
  if (!r.u) { me.cur = null; updateBattle(); return finishBattle(); }
  me.cur = r.u; me.mode = 'attack'; me.busy = false;
  updateBattle();
  if (r.u.side === 'f' || me.auto) {
    me.busy = true;
    me.timer = setTimeout(() => { if (Bt === me) { const c = aiChoose(me.B, r.u); doAct(r.u, c.kind, c.target); } }, 650);
  }
}

function doAct(u, kind, target) {
  const me = Bt; if (!me) return;
  me.busy = true;
  [...me.B.allies, ...me.B.foes].forEach(x => { x.vhp = x.hp; x.valive = x.alive; });   // полоски обновятся в момент удара
  const r = act(me.B, u, kind, target);
  $('#lg').textContent = r.text;
  const dur = playAction(me, u, kind, r.ev);
  updateBattle();
  me.timer = setTimeout(() => { if (Bt === me) battleLoop(); }, Math.max(850, dur + 250));
}

function finishBattle() {
  const me = Bt; me.over = true;
  { const dk = document.querySelector('.dock'); if (dk) dk.classList.add('off'); }
  const won = outcome(me.B) === 'win';
  if (me.train) { finishTraining(me, won); return; }
  const rw = rewards(S.stage, won);
  rw.coins = Math.round(rw.coins * bonus().coinMult);
  S.coins += rw.coins;
  const lines = [];
  S.team.map(byId).forEach((m, i) => {
    const u = me.B.allies[i];
    const gain = Math.round(rw.xp * (u && u.alive ? 1 : 0.6));
    const ups = addXp(m, gain);
    lines.push(`<li>${speciesName(m.g[0], m.g[1])}: <b>+${gain}</b> опыта${ups.length ? ` · уровень <b>${m.lvl}</b>` : ''}</li>`);
  });
  dq('fight'); if (won) dq('win');
  if (won) {
    S.wins++; S.stage++; S.best = Math.max(S.best, S.stage);
    S.foe = genFoeSpec(S.stage);
  } else S.losses++;
  save();
  if (won) submitScore();
  openModal(`<div class="center"><span class="new">${won ? 'Победа' : 'Поражение'}</span></div>
    <h3>${won ? 'Арена пройдена' : 'Команду разбили'}</h3>
    <p class="sub center">${won ? `Открыта стадия ${S.stage}.` : 'Враги остались прежними. Прокачай команду или скрести новых мутантов и попробуй ещё раз.'}</p>
    <ul class="list"><li>Монеты: <b>+${rw.coins}</b></li>${lines.join('')}</ul>
    <button class="btn primary wide" data-act="after-battle">Продолжить</button>`);
}

function finishTraining(me, won) {
  const streakBefore = S.trainStreak || 0;
  const avg = trainAvgLvl(S.team.map(byId));
  const mult = won ? trainMult(streakBefore) : 1;
  const base = won ? Math.round(trainWinXp(avg) * mult) : trainLoseXp(avg);
  S.trainStreak = won ? streakBefore + 1 : 0;
  const lines = [];
  S.team.map(byId).forEach((m, i) => {
    if (!m) return;
    const name = speciesName(m.g[0], m.g[1]);
    const u = me.B.allies[i];
    const gain = Math.round(base * (u && u.alive ? 1 : 0.6));
    const up = addXp(m, gain).length > 0;
    lines.push(`<li>${name}: <b>+${gain}</b> опыта${up ? ` · уровень <b>${m.lvl}</b>` : ''}</li>`);
  });
  save();
  const streakLine = won
    ? `Серия побед: <b>${S.trainStreak}</b>${mult > 1 ? ` · опыт ×${fmtMult(mult)}` : ''}. Следующая победа даст ×${fmtMult(trainMult(S.trainStreak))}.`
    : (streakBefore ? `Серия из ${streakBefore} побед прервалась.` : 'Победи, чтобы начать серию.');
  openModal(`<div class="center"><span class="new">${won ? 'Тренировка пройдена' : 'Тренировка не удалась'}</span></div>
    <h3>Полигон</h3>
    <p class="sub center">${streakLine}</p>
    <ul class="list">${lines.join('')}</ul>
    <p class="sub center" style="margin:0 0 10px">Монет за тренировку нет, стадия не меняется.</p>
    <button class="btn primary wide" data-act="after-battle">Продолжить</button>`);
}

function leaveBattle() {
  if (Bt) clearTimeout(Bt.timer);
  Bt = null; closeModal(); render();
}

/* ---------- ДЕЙСТВИЯ ---------- */
function newMutant(g, gen) {
  const m = { id: S.nextId++, g, lvl: 1, xp: 0, gen };
  S.mutants.push(m);
  const k = speciesKey(g[0], g[1]);
  const fresh = !S.seen[k]; S.seen[k] = 1;
  const bingo = fresh ? checkBingo(S) : [];
  return { m, fresh, bingo };
}

function bingoHTML(lines) {
  if (!lines.length) return '';
  return `<div class="bingo-note"><span class="new">Бинго!</span>
    <ul class="list" style="margin:8px 0 0">${lines.map(l => l.tier ? `<li>${tierStar(l.tier, 14)} <b>${TIERS[l.tier].name}: ${l.title}</b>. Награда: токен «${TIERS[l.tier].name.toLowerCase()}» ×1</li>` : `<li><b>${l.title}</b>: ${l.desc}. Монеты: <b>+${l.coins}</b></li>`).join('')}</ul></div>`;
}

function showNewborn(m, fresh, mutated, bingo = []) {
  openModal(`<div class="center">${fresh ? '<span class="new">Новый вид</span>' : ''}</div>
    ${art(m.g[0], m.g[1])}
    <h3>${speciesName(m.g[0], m.g[1])}</h3>
